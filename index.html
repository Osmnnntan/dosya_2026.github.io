<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DOSYA NO: 2026/417 — Dijital Soruşturma Bürosu</title>
<meta name="description" content="Gerçek bir dedektif gibi olay yerini incele, kanıt topla, şüphelileri sorgula, telefon kayıtlarını çöz ve gerçeği ortaya çıkar." />
<meta property="og:title" content="DOSYA NO: 2026/417 — Dijital Soruşturma Bürosu" />
<meta property="og:description" content="Kanıt topla, sorgula, kanıt panosunda ipleri birleştir ve katili bul." />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="/favicon.ico" type="image/x-icon" />
<style>
:root{
  --ink:#0a0a09; --coal:#0d0d0c; --coal2:#11110f; --panel:#161613;
  --paper:#e9e2cf; --paper2:#d8cfaf; --paper-ink:#221d15;
  --line:#232320; --line2:#302f2a;
  --txt:#e6e2d8; --dim:#8b8880; --dimmer:#55534e;
  --red:#a51d24; --red2:#c72d2f; --amber:#b68a35; --green:#66735b; --uv:#8b7cf0; --info:#6b8299;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --stamp:#a51d24;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--coal); color:var(--txt); font-family:var(--mono);
  font-size:14px; line-height:1.55; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#262a35;border:2px solid var(--coal)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- atmosphere ---------- */
#grain{position:fixed;inset:0;pointer-events:none;z-index:9000;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  mix-blend-mode:overlay;animation:grainmove 1.1s steps(3) infinite}
@keyframes grainmove{0%{transform:translate(0,0)}33%{transform:translate(-3px,2px)}66%{transform:translate(2px,-2px)}100%{transform:translate(0,0)}}
#scan{position:fixed;inset:0;pointer-events:none;z-index:9001;opacity:.35;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
#vign{position:fixed;inset:0;pointer-events:none;z-index:8999;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.65) 100%)}
@media (prefers-reduced-motion:reduce){#grain{animation:none}.hbtn.race{animation:none}}
body.noflair #grain,body.noflair #scan{display:none}

/* ---------- layout ---------- */
#app{display:flex;flex-direction:column;height:100%;position:relative;z-index:10}
header#top{
  display:flex;align-items:center;gap:14px;padding:8px 14px;
  background:linear-gradient(#12141a,#0e0f14);border-bottom:1px solid var(--line);
  flex:0 0 auto;flex-wrap:wrap;
}
.brandbox{display:flex;align-items:center;gap:10px;min-width:0}
.stamp{
  border:2px solid var(--stamp);color:var(--stamp);padding:1px 8px;font-weight:700;
  letter-spacing:3px;transform:rotate(-4deg);font-size:12px;opacity:.9;
  box-shadow:inset 0 0 0 1px rgba(163,39,31,.35)
}
.fileno{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fileno b{color:var(--paper2);letter-spacing:1px}
.spacer{flex:1 1 auto}
.hbtn{
  border:1px solid var(--line2);padding:4px 10px;font-size:11px;color:var(--dim);
  letter-spacing:1px;background:#14161c;transition:.15s
}
.hbtn:hover{color:var(--paper);border-color:var(--red);background:#191c25}
.hbtn.on{color:var(--amber);border-color:var(--amber)}
.hbtn.race{color:var(--red2);border-color:var(--red);font-family:var(--mono);letter-spacing:1px;animation:racepulse 2s infinite}
@keyframes racepulse{0%,100%{opacity:1}50%{opacity:.55}}
.rankchip{font-size:11px;color:var(--amber);border:1px dashed #6b5a2a;padding:3px 8px;white-space:nowrap}

nav#tabs{
  display:flex;gap:2px;padding:0 10px;background:#0c0d11;border-bottom:1px solid var(--line);
  overflow-x:auto;flex:0 0 auto;scrollbar-width:none
}
nav#tabs::-webkit-scrollbar{display:none}
.tab{
  padding:9px 13px;font-size:11.5px;letter-spacing:1.4px;color:var(--dimmer);
  border-bottom:2px solid transparent;white-space:nowrap;position:relative
}
.tab:hover{color:var(--paper2)}
.tab.active{color:var(--red2);border-bottom-color:var(--red);background:#191614}
.tab .dot{position:absolute;top:5px;right:4px;width:6px;height:6px;background:var(--amber);border-radius:50%}
main#view{flex:1 1 auto;overflow:auto;padding:18px;position:relative}
.wrap{max-width:1180px;margin:0 auto}

/* ---------- generic bits ---------- */
h1,h2,h3{font-weight:700;letter-spacing:1px;margin:0 0 10px}
h1{font-size:22px;color:var(--paper)}
h2{font-size:16px;color:var(--paper2);text-transform:uppercase}
h3{font-size:13px;color:var(--amber);letter-spacing:2px;text-transform:uppercase}
p{margin:0 0 10px}
.muted{color:var(--dim)}
.small{font-size:11.5px}
.sec{margin-bottom:26px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.panel{background:var(--panel);border:1px solid var(--line);padding:14px}
.panel.pad0{padding:0}
.btn{
  border:1px solid var(--line2);background:#191c25;padding:7px 13px;font-size:12px;
  letter-spacing:1px;color:var(--txt);transition:.15s
}
.btn:hover:not(:disabled){background:#2c2621;border-color:var(--red);color:var(--paper)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary{background:#3a1d19;border-color:var(--red);color:#f0c9c4}
.btn.primary:hover{background:#4d251f}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:11px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:10px;letter-spacing:1.5px;border:1px solid var(--line2);padding:2px 7px;color:var(--dim)}
.tag.red{color:var(--red2);border-color:#5d2a26}
.tag.amber{color:var(--amber);border-color:#5d4a20}
.tag.green{color:var(--green);border-color:#33502a}
.tag.uv{color:#a894ff;border-color:#3f3470}
hr.rule{border:none;border-top:1px dashed var(--line2);margin:14px 0}

/* paper document look */
.doc{
  background:linear-gradient(#efe7d6,#ded4bd);color:var(--paper-ink);
  padding:16px 18px;position:relative;box-shadow:0 8px 22px rgba(0,0,0,.5);
  border:1px solid #b9ad93
}
.doc:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><filter id='p'><feTurbulence baseFrequency='.7' numOctaves='2'/></filter><rect width='100' height='100' filter='url(%23p)' opacity='.5'/></svg>");
  mix-blend-mode:multiply}
.doc h4{margin:0 0 6px;font-size:13px;letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid #a89b80;padding-bottom:5px}
.doc .meta{font-size:10.5px;color:#6a6252;letter-spacing:1px;margin-bottom:8px}
.doc .stampmark{
  position:absolute;right:10px;top:8px;border:2px solid var(--stamp);color:var(--stamp);
  font-size:10px;letter-spacing:2px;padding:2px 6px;transform:rotate(7deg);opacity:.75
}
.redact{background:#14161c;color:transparent;padding:0 3px;transition:.25s;border-radius:1px;cursor:help}
.redact:hover{background:#c3b79c;color:#2a251d}

/* evidence cards */
.ecard{
  background:#1a1d26;border:1px solid var(--line2);padding:10px 12px;position:relative;
  transition:.15s;cursor:pointer
}
.ecard:hover{border-color:var(--red);background:#272119}
.ecard .et{font-size:12.5px;color:var(--paper2);margin-bottom:3px}
.ecard .ed{font-size:11px;color:var(--dim)}
.ecard.new:after{content:"YENİ";position:absolute;top:-8px;right:-6px;background:var(--red);color:#fff;font-size:9px;padding:1px 5px;letter-spacing:1px}

/* scene */
#sceneWrap{position:relative;overflow:hidden;background:#0b0a09;border:1px solid var(--line);height:min(62vh,540px);cursor:grab;touch-action:none}
#sceneLayer{filter:brightness(1.22) contrast(1.05) saturate(1.08)}
#sceneWrap.grabbing{cursor:grabbing}
#sceneLayer{position:absolute;inset:0;transform-origin:0 0}
.hot{
  position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
  border:1px solid rgba(216,180,120,.35);background:rgba(216,180,120,.06);
  display:flex;align-items:center;justify-content:center;transition:.18s
}
.hot:hover{border-color:var(--red2);background:rgba(184,51,42,.18);transform:scale(1.15)}
.hot i{width:6px;height:6px;background:rgba(230,200,150,.7);border-radius:50%;display:block}
.hot.found{border-color:var(--green);background:rgba(95,140,77,.15)}
.hot.found i{background:var(--green)}
.hot.hidden{opacity:0;pointer-events:none}
.hot.uvonly{border-color:rgba(123,92,255,.5)}
#sceneWrap.uv #sceneLayer{filter:hue-rotate(215deg) saturate(1.7) brightness(.72) contrast(1.25)}
#sceneWrap.dust #sceneLayer{filter:grayscale(.55) contrast(1.3) brightness(1.06)}
#sceneWrap.chem #sceneLayer{filter:sepia(.5) hue-rotate(-25deg) contrast(1.2)}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.toolbtn{border:1px solid var(--line2);padding:6px 11px;font-size:11px;letter-spacing:1px;color:var(--dim);background:#1b1815}
.toolbtn.on{border-color:var(--amber);color:var(--amber);background:#241f16}
.toolbtn:disabled{opacity:.3}
.lens{position:absolute;width:170px;height:170px;border-radius:50%;pointer-events:none;display:none;
  border:2px solid rgba(230,200,150,.35);box-shadow:0 0 0 9999px rgba(0,0,0,.35),inset 0 0 30px rgba(0,0,0,.6);
  backdrop-filter:saturate(1.4) contrast(1.4) brightness(1.15)}
#sceneWrap.mag .lens{display:block}

/* suspects */
.sus{background:var(--panel);border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
.sus .head{display:flex;gap:11px;align-items:flex-start}
.portrait{width:70px;height:86px;flex:0 0 auto;border:1px solid var(--line2);background:#0d0e13;overflow:hidden;position:relative}
.portrait svg{display:block;width:100%;height:100%}
.portrait:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
.meter{height:7px;background:#0d0e13;border:1px solid var(--line2);position:relative}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#4a6b3d,#c9a02c,var(--red))}
input[type=range]{width:100%;accent-color:var(--red)}

/* chat / phone */
.phone{width:330px;max-width:100%;margin:0 auto;background:#0a0a0b;border:10px solid #17161a;border-radius:26px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.phone .status{display:flex;justify-content:space-between;padding:6px 14px;font-size:10px;color:#9a9a9a;background:#111}
.phone .appbar{display:flex;align-items:center;gap:9px;padding:9px 12px;background:#1f2c33;color:#e9edef;font-size:12.5px}
.phone .body{height:380px;overflow:auto;padding:10px;background:#0b141a}
.bub{max-width:78%;padding:6px 9px;border-radius:8px;margin-bottom:7px;font-size:12px;line-height:1.45;position:relative;color:#e9edef}
.bub.them{background:#202c33}
.bub.me{background:#005c4b;margin-left:auto}
.bub .t{display:block;font-size:9px;color:#8696a0;text-align:right;margin-top:2px}
.bub .corrupt{background:#3a3a3a;color:#6b6b6b;padding:0 4px;border-radius:2px}
.iglist{background:#000;color:#fafafa}
.igrow{display:flex;gap:10px;padding:9px 10px;border-bottom:1px solid #1c1c1c;font-size:12px;align-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);flex:0 0 auto}
.callrow{display:flex;justify-content:space-between;padding:9px 12px;border-bottom:1px solid #1a1a1a;font-size:12px;color:#ddd;background:#101010}
.callrow .num{color:#7fd3ff}
.phoneTabs{display:flex;background:#111;border-top:1px solid #222}
.phoneTabs button{flex:1;padding:8px 2px;font-size:9.5px;color:#7d7d7d;letter-spacing:.5px}
.phoneTabs button.on{color:#fff;background:#1b1b1b}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:14px}
.keypad button{border:1px solid #2a2a2a;padding:13px 0;font-size:17px;color:#ddd;border-radius:50%;background:#141414}
.pindots{display:flex;gap:9px;justify-content:center;padding:14px 0}
.pindots i{width:11px;height:11px;border-radius:50%;border:1px solid #555;display:block}
.pindots i.f{background:#fff;border-color:#fff}

/* camera */
.cam{background:#0a0a0a;border:1px solid var(--line);position:relative;overflow:hidden}
.camimg{width:100%;aspect-ratio:4/3;display:block;filter:contrast(var(--cc,1.15)) brightness(var(--cb,.85)) grayscale(.35)}
.camhud{position:absolute;inset:0;pointer-events:none;font-size:10px;color:#c9ffcf;text-shadow:0 0 5px rgba(0,0,0,.9)}
.camhud .tl{position:absolute;top:6px;left:8px}
.camhud .tr{position:absolute;top:6px;right:8px}
.camhud .bl{position:absolute;bottom:6px;left:8px}
.camhud .rec{color:#ff5b52}
.camnoise{position:absolute;inset:0;opacity:.16;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='c'><feTurbulence baseFrequency='.85' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23c)'/></svg>")}

/* board */
#board{position:relative;height:min(70vh,620px);background:
  linear-gradient(rgba(20,18,16,.9),rgba(20,18,16,.9)),
  repeating-linear-gradient(45deg,#2a241d 0 12px,#282219 12px 24px);
  border:1px solid var(--line);overflow:hidden;touch-action:none}
#boardSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pin{position:absolute;width:150px;background:#e9e1d0;color:#241f18;border:1px solid #b6a98d;
  padding:8px 9px;font-size:10.5px;line-height:1.35;cursor:grab;box-shadow:0 6px 14px rgba(0,0,0,.55);user-select:none}
.pin.dragging{cursor:grabbing;z-index:50;box-shadow:0 12px 26px rgba(0,0,0,.7)}
.pin:before{content:"";position:absolute;top:-7px;left:50%;margin-left:-6px;width:12px;height:12px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#e05a4e,#8a1f18)}
.pin .pt{font-weight:700;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#7a2820;margin-bottom:3px}
.pin.sel{outline:2px solid var(--red2)}
.pin.linking{outline:2px dashed var(--amber)}

/* network / timeline / map */
.netnode{position:absolute;transform:translate(-50%,-50%);text-align:center;width:96px}
.netnode .nb{border:1px solid var(--line2);background:#191c25;padding:6px 4px;font-size:10.5px;color:var(--paper2)}
.netnode.victim .nb{border-color:var(--red);color:#f0b8b2}
.tl-row{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;margin-bottom:7px}
.tl-track{position:relative;height:30px;background:#101218;border:1px solid var(--line)}
.tl-item{position:absolute;top:3px;height:22px;background:#2c2620;border:1px solid var(--line2);
  font-size:9.5px;color:var(--dim);display:flex;align-items:center;padding:0 5px;overflow:hidden;white-space:nowrap;cursor:pointer}
.tl-item.lie{border-color:var(--red);color:#e79c94;background:#301b18}
.tl-item.ok{border-color:#3c5a30}
#mapWrap{position:relative;height:min(60vh,480px);background:#12110f;border:1px solid var(--line);overflow:hidden}
.mapdot{position:absolute;transform:translate(-50%,-50%);text-align:center}
.mapdot .d{width:12px;height:12px;border-radius:50%;background:var(--amber);margin:0 auto;box-shadow:0 0 12px rgba(214,154,42,.6)}
.mapdot .l{font-size:10px;color:var(--dim);margin-top:3px;white-space:nowrap}
.mapdot.active .d{background:var(--red2);box-shadow:0 0 16px rgba(224,72,60,.8)}

/* misc */
.toast{position:fixed;right:16px;bottom:16px;z-index:9500;display:flex;flex-direction:column;gap:8px;max-width:330px}
.toastitem{background:#1b1e28;border-left:3px solid var(--amber);padding:10px 12px;font-size:11.5px;
  box-shadow:0 10px 26px rgba(0,0,0,.6);animation:slidein .3s ease}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.modalbg{position:fixed;inset:0;background:rgba(5,4,4,.82);z-index:9200;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:var(--coal2);border:1px solid var(--line2);max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:18px;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.7)}
.modal .x{position:absolute;top:8px;right:10px;color:var(--dim);font-size:18px}
.glitch{animation:gl .35s steps(2) 1}
@keyframes gl{0%{transform:translate(0)}25%{transform:translate(-3px,1px);filter:hue-rotate(25deg)}50%{transform:translate(3px,-1px)}75%{transform:translate(-1px,2px);filter:contrast(1.4)}100%{transform:none}}
.typer::after{content:"▌";color:var(--red2);animation:blink .9s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.kv{display:grid;grid-template-columns:112px 1fr;gap:4px 10px;font-size:11.5px}
.kv b{color:var(--dim);font-weight:400}
.stat{border:1px solid var(--line);background:#14161c;padding:10px}
.stat .n{font-size:20px;color:var(--paper);letter-spacing:1px}
.stat .l{font-size:10px;color:var(--dimmer);letter-spacing:1.5px;text-transform:uppercase}
.choice{display:block;width:100%;text-align:left;border:1px solid var(--line2);background:#1b1815;padding:9px 11px;margin-bottom:7px;font-size:12px}
.choice:hover{border-color:var(--red);background:#241d19}
.choice .tone{font-size:9.5px;letter-spacing:1.5px;color:var(--amber);display:block;margin-bottom:2px}
.choice.used{opacity:.45}
.transcript{border-left:2px solid var(--line2);padding-left:10px;margin-bottom:10px;font-size:12px}
.transcript .q{color:var(--amber)}
.transcript .a{color:var(--txt)}
.ratebar{display:inline-block;width:70px;height:6px;background:#2a251c;border-radius:3px;overflow:hidden;vertical-align:middle}
.ratebar i{display:block;height:100%;width:var(--pct,0%);background:var(--amber)}
.progressbar{height:5px;background:#0d0e13;border:1px solid var(--line)}
.progressbar i{display:block;height:100%;background:var(--red)}
.locked{opacity:.45;filter:grayscale(.6)}
.center{text-align:center}
.big{font-size:34px;letter-spacing:6px;color:var(--red2)}
label.f{display:block;font-size:10.5px;letter-spacing:1.5px;color:var(--dim);margin:9px 0 3px;text-transform:uppercase}
input.f,textarea.f,select.f{width:100%;background:#0f1116;border:1px solid var(--line2);padding:7px 9px;color:var(--txt)}
textarea.f{min-height:80px;resize:vertical}
.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);padding:4px 8px;font-size:10.5px;color:var(--dim)}
.badge.got{border-color:var(--amber);color:var(--amber)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.recon-item{border:1px solid var(--line2);background:#161821;padding:8px 10px;margin-bottom:6px;font-size:11.5px;cursor:grab}
.recon-item.dragging{opacity:.4}
</style>
</head>
<body>
<div id="grain"></div><div id="scan"></div><div id="vign"></div>
<div id="app">
  <header id="top">
    <div class="brandbox">
      <span class="stamp">GİZLİ</span>
      <span class="fileno" id="fileno">DOSYA NO: <b>—</b></span>
    </div>
    <span class="spacer"></span>
    <span class="rankchip" id="rankchip">ÇAYLAK</span>
    <button class="hbtn" id="btnHint">İPUCU</button>
    <button class="hbtn" id="btnSound">SES: KAPALI</button>
    <button class="hbtn" id="btnFlair">EFEKT</button>
    <button class="hbtn" id="btnMenu">DOSYALAR</button>
  </header>
  <nav id="tabs"></nav>
  <main id="view"><div class="wrap" id="viewInner"></div></main>
</div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>
<script>
/* ============================================================

function shuffleArr(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  // aynı diziyle (orijinal sırayla) eşleşme ihtimalini pratikte sıfırla
  if(a.length>1 && a.every((v,i)=>v===arr[i])){ [a[0],a[1]]=[a[1],a[0]]; }
  return a;
}

function evCatalog(c){

  return m;
}

/* ---------- ses (Web Audio, dosyasız) ---------- */
let AC=null,ambientNodes=null;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function noiseBuffer(ctx,sec){
  const b=ctx.createBuffer(1,ctx.sampleRate*sec,ctx.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b;
}
function startAmbient(){
  if(ambientNodes) return; const ctx=ac();
  const src=ctx.createBufferSource(); src.buffer=noiseBuffer(ctx,4); src.loop=true;
  const f=ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=520;
  const g=ctx.createGain(); g.gain.value=0.02;
  src.connect(f); f.connect(g); g.connect(ctx.destination); src.start();
  // uzak telsiz cızırtısı
  const rad=setInterval(()=>{
    if(!S.sound) return;
    const t=ctx.currentTime, s2=ctx.createBufferSource(); s2.buffer=noiseBuffer(ctx,.5);
    const bp=ctx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=1400+Math.random()*900; bp.Q.value=9;
    const g2=ctx.createGain(); g2.gain.setValueAtTime(0,t); g2.gain.linearRampToValueAtTime(.05,t+.06);
    g2.gain.linearRampToValueAtTime(0,t+.45);
    s2.connect(bp); bp.connect(g2); g2.connect(ctx.destination); s2.start(); s2.stop(t+.5);
  }, 14000);
  ambientNodes={src,g,rad};
}
function stopAmbient(){ if(!ambientNodes)return; try{ambientNodes.src.stop();clearInterval(ambientNodes.rad);}catch(e){} ambientNodes=null; }
function sfx(kind){
  if(!S||!S.sound) return; const ctx=ac(),t=ctx.currentTime;
  if(kind==="paper"||kind==="blip"){
    const s=ctx.createBufferSource(); s.buffer=noiseBuffer(ctx,.25);
    const f=ctx.createBiquadFilter(); f.type="highpass"; f.frequency.value=kind==="paper"?1800:900;
    const g=ctx.createGain(); g.gain.setValueAtTime(.06,t); g.gain.exponentialRampToValueAtTime(.001,t+.22);
    s.connect(f);f.connect(g);g.connect(ctx.destination); s.start(); s.stop(t+.25);
  } else if(kind==="stamp"){
    const o=ctx.createOscillator(),g=ctx.createGain(); o.type="square"; o.frequency.setValueAtTime(90,t);
    o.frequency.exponentialRampToValueAtTime(40,t+.14); g.gain.setValueAtTime(.14,t);
    g.gain.exponentialRampToValueAtTime(.001,t+.2); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(t+.22);
  } else if(kind==="type"){
    const o=ctx.createOscillator(),g=ctx.createGain(); o.type="triangle"; o.frequency.value=1200+Math.random()*400;
    g.gain.setValueAtTime(.03,t); g.gain.exponentialRampToValueAtTime(.001,t+.05);
    o.connect(g);g.connect(ctx.destination);o.start();o.stop(t+.06);
  } else if(kind==="unlock"){
    const o=ctx.createOscillator(),g=ctx.createGain(); o.type="sine"; o.frequency.setValueAtTime(320,t);
    o.frequency.exponentialRampToValueAtTime(880,t+.22); g.gain.setValueAtTime(.08,t);
    g.gain.exponentialRampToValueAtTime(.001,t+.3); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(t+.32);
  }
}

function solveTasksFor(c){

  });
  if(typeof DIGITAL!=="undefined" && DIGITAL[c.id] && DIGITAL[c.id].cloud && DIGITAL[c.id].cloud.items && DIGITAL[c.id].cloud.items.length){
    tasks.push({key:"hexlock",label:"Bulut yedeğindeki şifreli blok çözülmeli (Dijital > Bulut)",done:!!cs.cloudUnlocked});
  }
  return tasks;
}

let sceneView={z:1,x:0,y:0,tool:null};
function viewScene(v){
  const c=C(),cs=CS();
  const maxLooks = S.hard?10:16;
  const tb=el("div","toolbar");
  const tools=["mag","uv","dust","chem","metal"];
  tb.appendChild(el("span","tag amber","İNCELEME HAKKI: "+(maxLooks-cs.looks)+" / "+maxLooks));
  tools.forEach(k=>{
    const b=el("button","toolbtn"+(sceneView.tool===k?" on":""),TOOLS[k].label);
    b.title=TOOLS[k].hint;
    b.onclick=()=>{ sceneView.tool = sceneView.tool===k?null:k; render(); };
    tb.appendChild(b);
  });
  const rst=el("button","toolbtn","GÖRÜNÜMÜ SIFIRLA"); rst.onclick=()=>{sceneView.z=1;sceneView.x=0;sceneView.y=0;render();};
  tb.appendChild(rst);
  v.appendChild(tb);

  const wrap=el("div","");
  wrap.id="sceneWrap";
  if(sceneView.tool) wrap.classList.add(sceneView.tool);
  const layer=el("div",""); layer.id="sceneLayer"; layer.innerHTML=sceneSVG(c.scene.id);
  wrap.appendChild(layer);
  const lens=el("div","lens"); lens.style.left="calc(50% - 85px)"; lens.style.top="calc(50% - 85px)"; wrap.appendChild(lens);

  c.scene.hotspots.forEach((h,i)=>{
    const key=c.scene.id+"_"+i;
    const need=h.tool;
    const visible = !need || sceneView.tool===need;
    const b=el("button","hot"+(cs.found[key]?" found":"")+(visible?"":" hidden")+(need==="uv"?" uvonly":""),"<i></i>");
    b.style.left=h.x+"px"; b.style.top=h.y+"px"; b.title=visible?h.label:"";
    b.onclick=(e)=>{ e.stopPropagation(); inspect(h,key,maxLooks); };
    layer.appendChild(b);
  });

  const apply=()=>{ layer.style.transform=`translate(${sceneView.x}px,${sceneView.y}px) scale(${sceneView.z})`; };
  apply();
  // pan
  let drag=null;
  wrap.addEventListener("pointerdown",e=>{ if(e.target.closest(".hot"))return; drag={x:e.clientX,y:e.clientY,ox:sceneView.x,oy:sceneView.y}; wrap.classList.add("grabbing"); wrap.setPointerCapture(e.pointerId); });
  wrap.addEventListener("pointermove",e=>{
    const r=wrap.getBoundingClientRect();
    lens.style.left=(e.clientX-r.left-85)+"px"; lens.style.top=(e.clientY-r.top-85)+"px";
    if(!drag)return; sceneView.x=drag.ox+(e.clientX-drag.x); sceneView.y=drag.oy+(e.clientY-drag.y); apply();
  });
  wrap.addEventListener("pointerup",e=>{drag=null;wrap.classList.remove("grabbing");});
  wrap.addEventListener("pointerleave",()=>{drag=null;wrap.classList.remove("grabbing");});
  // zoom (imleç sabitli, delta ölçekli, non-passive)
  wrap.addEventListener("wheel",e=>{
    e.preventDefault();
    const dy=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?100:1);
    const next=Math.min(3.2,Math.max(.6,sceneView.z*Math.exp(-dy*0.0015)));
    const r=wrap.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,k=next/sceneView.z;
    sceneView.x=px-(px-sceneView.x)*k; sceneView.y=py-(py-sceneView.y)*k; sceneView.z=next; apply();
  },{passive:false});
  v.appendChild(wrap);

  const info=el("div","sec small muted");
  info.style.marginTop="10px";
  info.innerHTML="Tekerlek: yakınlaştır · Sürükle: gez · Araç seçince o araca özel noktalar görünür. "+
    (sceneView.tool?("<span class='tag amber' style='margin-left:6px'>"+TOOLS[sceneView.tool].label+": "+TOOLS[sceneView.tool].hint+"</span>"):"");
  v.appendChild(info);

  const got=el("div","sec");
  got.innerHTML="<h3>Bu olay yerinden toplananlar</h3>";
  const g=el("div","grid g3");
  const items=c.scene.hotspots.filter((h,i)=>cs.found[c.scene.id+"_"+i]&&h.ev);
  if(!items.length) g.innerHTML="<div class='panel small muted'>Henüz kanıt toplanmadı.</div>";
  items.forEach(h=>{ g.appendChild(evCard(h.ev.id)); });
  got.appendChild(g); v.appendChild(got);
}

function inspect(h,key,maxLooks){
  const cs=CS();
  if(!cs.found[key]){
    if(cs.looks>=maxLooks){ toast("İnceleme hakkın bitti. Elindeki kanıtlarla düşünmelisin.","red"); return; }
    cs.looks++;
  }
  cs.found[key]=true; sfx("paper");
  const html=`<h2>${esc(h.label)}</h2>
    <p>${esc(h.text)}</p>
    ${h.ev?`<div class="doc" style="margin-top:12px"><div class="stampmark">KANIT</div>
      <h4>${esc(h.ev.title)}</h4><div class="meta">${esc(h.ev.type)}</div><p>${esc(h.ev.body)}</p></div>`:""}
    <div class="row" style="margin-top:14px">${h.ev?`<button class="btn primary" id="mAdd">KANIT OLARAK TOPLA</button>`:""}
      <span class="small muted">Kalan inceleme: ${maxLooks-cs.looks}</span></div>`;
  const {bg}=modal(html);
  const b=$("#mAdd",bg);
  if(b) b.onclick=()=>{ if(h.ev.cipher){ toast("Bu kanıt şifreli. NOT DEFTERİ > Şifre çözücü bölümünde deşifre et.","amber"); }
    addEv(h.ev.id); bg.remove(); render(); };
  save();
}

function evCard(id,onclick){
  const e=evOf(id); const d=el("div","ecard"+(CS().ev[id]&&CS().ev[id].neu?" new":""));
  d.innerHTML=`<div class="et">${esc(e?e.title:id)}</div><div class="ed">${esc(e?e.type:"")}</div>`;
  d.onclick=onclick||(()=>{
    if(CS().ev[id]) CS().ev[id].neu=false;
    modal(`<div class="doc"><div class="stampmark">KANIT</div><h4>${esc(e.title)}</h4>
      <div class="meta">${esc(e.type)}</div><p>${esc(e.body)}</p></div>
      ${(C().redHerrings||[]).includes(id)?"<p class='small muted' style='margin-top:10px'>Not: her kanıt suça ait olmak zorunda değil.</p>":""}`);
    render();
  });
  return d;
}

        ${c.id==="c1"?`<button class="btn sm" data-take="e_dm">DM DÖKÜMÜNÜ AL</button>
        <button class="btn sm" data-take="e_diary">GÜNLÜĞÜ EKLE</button>`:""}
      </div></div>`;
  side.appendChild(l); side.appendChild(r); v.appendChild(side);
  setTimeout(()=>{
    ph.querySelectorAll("[data-pt]").forEach(b=>b.onclick=()=>{phoneTab=b.dataset.pt;render();});
    ph.querySelectorAll("[data-gal]").forEach(b=>b.onclick=()=>{
      const id=b.dataset.gal, g=p.gallery.find(x=>x.id===id);
      if(g&&g.needs&&!has(g.needs)){ toast("Bu dosya bulutta. Önce ilgili cihazı olay yerinde bulmalısın.","red"); return; }
      addEv(id); render();
    });
    r.querySelectorAll("[data-wa]").forEach(b=>b.onclick=()=>{window.__waIdx=+b.dataset.wa;phoneTab="wa";render();});
    r.querySelectorAll("[data-take]").forEach(b=>b.onclick=()=>{ if(!addEv(b.dataset.take)) toast("Zaten panoda.","red"); render(); });
  },0);
}
</script>
<script>
/* ============================================================
   BÖLÜM 4 — LAB, İLİŞKİ, ZAMAN, HARİTA, PANO, NOT, CANLANDIRMA,
             ÇÖZÜM, BÜRO (arşiv/topluluk/modlar), İPUCU, AÇILIŞ
   ============================================================ */

/* ---------------- LABORATUVAR ---------------- */
function labReady(){
  const cs=CS(); let r=false;
  (C().lab||[]).forEach(t=>{ const st=cs.lab[t.id]; if(st&&!st.read&&Date.now()>=st.at) r=true; });
  return r;
}
function viewLab(v){
  const c=C(),cs=CS();
  v.appendChild(el("div","sec",`<h1>Adli laboratuvar</h1>
    <p class="muted small">Kanıtı gönder, sonuç bir süre sonra gelir. Beklerken başka bir yere bakabilirsin.</p>`));
  const g=el("div","grid g2");
  (c.lab||[]).forEach(t=>{
    const st=cs.lab[t.id], have=has(t.need), done=st&&Date.now()>=st.at;
    const d=el("div","panel"+(have?"":" locked"));
    d.innerHTML=`<div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(t.title)}</h3>
      <span class="tag ${done?"green":st?"amber":""}">${done?"SONUÇ HAZIR":st?"İŞLEMDE":have?"GÖNDERİLEBİLİR":"KANIT YOK"}</span></div>
      <div class="small muted" style="margin:6px 0">Gerekli kanıt: ${esc((evOf(t.need)||{}).title||t.need)}</div>
      ${done?`<div class="doc" style="margin-top:8px"><div class="stampmark">RAPOR</div><h4>${esc(t.title)}</h4>
        <div class="meta">ADLİ TIP / KRİMİNAL LABORATUVAR</div><p>${esc(t.result)}</p></div>`:""}
      ${!st&&have?`<button class="btn primary sm" data-send="${t.id}">LABORATUVARA GÖNDER</button>`:""}
      ${st&&!done?`<div class="progressbar"><i id="pb_${t.id}" style="width:0%"></i></div>
        <div class="small muted" id="pt_${t.id}" style="margin-top:4px">Analiz sürüyor…</div>`:""}`;
    g.appendChild(d);
    setTimeout(()=>{
      const sb=$("[data-send]",d);
      if(sb) sb.onclick=()=>{ cs.lab[t.id]={at:Date.now()+t.delay*1000,read:false}; toast("Numune laboratuvara gönderildi ("+t.delay+" sn).","amber"); save(); render(); };
      if(st&&!done){
        const total=t.delay*1000, iv=setInterval(()=>{
          const left=st.at-Date.now(); const pb=document.getElementById("pb_"+t.id);
          if(!pb){clearInterval(iv);return;}
          pb.style.width=Math.max(0,Math.min(100,100-(left/total*100)))+"%";
          if(left<=0){ clearInterval(iv); toast("LABORATUVAR SONUCU GELDİ: "+t.title,"green"); if(t.gives) addEv(t.gives); render(); }
        },250);
      }
      if(done&&st&&!st.read){ st.read=true; if(t.gives) addEv(t.gives,true); save(); }
    },0);
  });
  v.appendChild(g);
}

/* ---------------- İLİŞKİ AĞI ---------------- */
function viewNetwork(v){
  const c=C(),n=c.network;
  v.appendChild(el("div","sec",`<h1>İlişki ağı</h1>
    <p class="muted small">Gizli bağlantılar kanıt buldukça açılır. Kırmızı hat: doğrudan çatışma.</p>`));
  const box=el("div","panel pad0"); box.style.position="relative"; box.style.height="min(62vh,520px)"; box.style.overflow="hidden";
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("style","position:absolute;inset:0;width:100%;height:100%");
  n.links.forEach(lk=>{
    const open=!lk.locked||has(lk.locked);
    const A=n.nodes.find(x=>x.id===lk.a),B=n.nodes.find(x=>x.id===lk.b); if(!A||!B)return;
    const ln=document.createElementNS("http://www.w3.org/2000/svg","line");
    ln.setAttribute("x1",A.x+"%");ln.setAttribute("y1",A.y+"%");ln.setAttribute("x2",B.x+"%");ln.setAttribute("y2",B.y+"%");
    ln.setAttribute("stroke",open?(lk.red?"#b8332a":"#5c5245"):"#2a2620");
    ln.setAttribute("stroke-width",open?2:1); if(!open) ln.setAttribute("stroke-dasharray","4 6");
    svg.appendChild(ln);
    const tx=document.createElementNS("http://www.w3.org/2000/svg","text");
    tx.setAttribute("x",((A.x+B.x)/2)+"%");tx.setAttribute("y",((A.y+B.y)/2)+"%");
    tx.setAttribute("fill",open?"#8f8471":"#39332b");tx.setAttribute("font-size","10");tx.setAttribute("text-anchor","middle");
    tx.setAttribute("font-family","monospace");
    tx.textContent=open?lk.label:"??? kilitli";
    svg.appendChild(tx);
  });
  box.appendChild(svg);
  n.nodes.forEach(nd=>{
    const d=el("div","netnode"+(nd.victim?" victim":""));
    d.style.left=nd.x+"%"; d.style.top=nd.y+"%";
    d.innerHTML=`<div class="nb">${esc(nd.label)}</div>`;
    box.appendChild(d);
  });
  v.appendChild(box);
}

/* ---------------- ZAMAN ÇİZELGESİ ---------------- */
function viewTimeline(v){
  const c=C(),t=c.timeline;
  v.appendChild(el("div","sec",`<h1>Zaman çizelgesi</h1>
    <p class="muted small">Beyanlar ile kanıtlar çakıştığında "YALAN" damgası düşer.</p>`));
  const p=el("div","panel");
  p.innerHTML=`<div class="tl-row"><div></div><div class="row small muted" style="justify-content:space-between">${t.hours.map(h=>`<span>${h}</span>`).join("")}</div></div>`;
  const span=t.hours.length-1;
  t.rows.forEach(r=>{
    const s=c.suspects.find(x=>x.id===r.s)||{name:r.s};
    const row=el("div","tl-row");

    r.items.forEach(it=>{
      if(it.hidden&&!has(it.hidden)) return;

      d.style.left=(it.from/span*100)+"%"; d.style.width=Math.max(6,(it.to-it.from)/span*100)+"%";
      d.textContent=(lie?"YALAN — ":"")+it.label;

        ${lie?"<p class='small' style='color:var(--red2)'>Bu beyan elindeki kanıtla çelişiyor.</p>":"<p class='small muted'>Şimdilik çelişki yok.</p>"}`);
      track.appendChild(d);
    });
    row.innerHTML=`<div class="small" style="color:var(--paper2)">${esc(s.name)}</div>`;
    row.appendChild(track); p.appendChild(row);
  });
  v.appendChild(p);
}

/* ---------------- HARİTA ---------------- */
function viewMap(v){
  const c=C(),m=c.map,cs=CS();
  if(cs.mapT==null) cs.mapT=0;
  v.appendChild(el("div","sec",`<h1>Harita</h1>
    <p class="muted small">Kaydırıcı ile zamanı ilerlet; şüpheli hareketleri buna göre canlanır. Noktalar panoya kanıt olarak eklenebilir.</p>`));
  const box=el("div",""); box.id="mapWrap";
  box.innerHTML=`<svg style="position:absolute;inset:0;width:100%;height:100%">
    <defs><pattern id="gp" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c1a17" stroke-width="1"/></pattern></defs>
    <rect width="100%" height="100%" fill="url(#gp)"/>
    <path d="M0,55% Q30%,40% 60%,58% T100%,50%" stroke="#1e2a30" stroke-width="18" fill="none" opacity=".7"/>
    <path d="M18%,0 L26%,100%" stroke="#241f18" stroke-width="8" fill="none"/>
    <path d="M0,72% L100%,66%" stroke="#241f18" stroke-width="6" fill="none"/>
  </svg>`;
  m.places.forEach(pl=>{
    const d=el("div","mapdot"); d.style.left=pl.x+"%"; d.style.top=pl.y+"%";
    d.innerHTML=`<div class="d"></div><div class="l">${esc(pl.name)}</div>`;
    d.onclick=()=>{
      modal(`<h2>${esc(pl.name)}</h2><p class="small muted">Konum kaydı</p>
        ${pl.ev?`<button class="btn primary sm" id="mp">PANOYA KANIT OLARAK EKLE</button>`:"<p class='small muted'>Bu noktadan çıkarılacak bir kanıt yok.</p>"}`);
      setTimeout(()=>{const b=document.getElementById("mp"); if(b)b.onclick=()=>{addEv(pl.ev);document.querySelector(".modalbg").remove();render();};},0);
    };
    box.appendChild(d);
  });
  // hareketler
  (m.moves||[]).forEach(mv=>{
    const t=cs.mapT;
    let cur=mv.path[0];
    mv.path.forEach(p=>{ if(p[1]<=t) cur=p; });
    const pl=m.places.find(x=>x.id===cur[0]); if(!pl)return;
    const s=C().suspects.find(x=>x.id===mv.s);
    const d=el("div","mapdot active"); d.style.left=(pl.x+2)+"%"; d.style.top=(pl.y-5)+"%";
    d.innerHTML=`<div class="d" style="background:var(--red2)"></div><div class="l" style="color:var(--red2)">${esc(s?s.name:mv.s)}</div>`;
    box.appendChild(d);
  });
  v.appendChild(box);
  const ctl=el("div","panel"); ctl.style.marginTop="12px";
  ctl.innerHTML=`<div class="small muted">ZAMAN: <b id="mt">${(20+Math.floor(cs.mapT)).toString().padStart(2,"0")}:00 civarı</b></div>
    <input type="range" min="0" max="5" step="0.1" value="${cs.mapT}" id="mrange">`;
  v.appendChild(ctl);
  setTimeout(()=>{ $("#mrange",ctl).oninput=e=>{ cs.mapT=+e.target.value; save(); render(); }; },0);
}

/* ---------------- KANIT PANOSU ---------------- */
let linkFrom=null;
function viewBoard(v){
  const c=C(),cs=CS();
  v.appendChild(el("div","sec",`<h1>Kanıt panosu</h1>
    <p class="muted small">Kartları sürükle. Bir karta tıklayıp ardından başka bir karta tıklarsan aralarına kırmızı ip çekilir. Doğru bağlantı bir çıkarım açar.</p>`));
  const board=el("div",""); board.id="board";
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg"); svg.id="boardSvg"; board.appendChild(svg);
  const ids=Object.keys(cs.ev);
  if(!ids.length) board.appendChild(el("div","small muted","<div style='padding:20px'>Panoda kanıt yok. Olay yerine, telefona ve sorguya git.</div>"));
  ids.forEach((id,i)=>{
    const e=evOf(id); if(!e) return;
    if(!cs.board.pos[id]) cs.board.pos[id]={x:24+(i%6)*172,y:26+Math.floor(i/6)*126};
    const p=el("div","pin"+(linkFrom===id?" linking":""));
    p.style.left=cs.board.pos[id].x+"px"; p.style.top=cs.board.pos[id].y+"px";
    p.innerHTML=`<div class="pt">${esc(e.type)}</div>${esc(e.title)}`;
    p.dataset.id=id;
    let moved=false,st=null;
    p.addEventListener("pointerdown",ev=>{ st={x:ev.clientX,y:ev.clientY,ox:cs.board.pos[id].x,oy:cs.board.pos[id].y};moved=false;p.classList.add("dragging");p.setPointerCapture(ev.pointerId); });
    p.addEventListener("pointermove",ev=>{ if(!st)return; const dx=ev.clientX-st.x,dy=ev.clientY-st.y;
      if(Math.abs(dx)+Math.abs(dy)>4)moved=true;
      cs.board.pos[id]={x:Math.max(0,st.ox+dx),y:Math.max(0,st.oy+dy)};
      p.style.left=cs.board.pos[id].x+"px";p.style.top=cs.board.pos[id].y+"px"; drawLinks(); });
    p.addEventListener("pointerup",ev=>{ st=null;p.classList.remove("dragging"); save();
      if(!moved){
        if(linkFrom&&linkFrom!==id){ makeLink(linkFrom,id); linkFrom=null; render(); }
        else if(linkFrom===id){ linkFrom=null; render(); }
        else { linkFrom=id; render(); }
      }});
    board.appendChild(p);
  });
  v.appendChild(board);
  const tools=el("div","row"); tools.style.marginTop="10px";
  const clear=el("button","btn sm","BAĞLANTILARI TEMİZLE"); clear.onclick=()=>{cs.board.links=[];save();render();};
  const auto=el("button","btn sm","KARTLARI DÜZENLE"); auto.onclick=()=>{cs.board.pos={};save();render();};
  tools.appendChild(clear);tools.appendChild(auto);
  tools.appendChild(el("span","small muted",linkFrom?("BAĞLANTI MODU: "+esc((evOf(linkFrom)||{}).title)+" → hedef kartı seç"):"Kart seç → ip çek"));
  v.appendChild(tools);

  const ins=el("div","sec"); ins.style.marginTop="18px";
  const found=(cs.board.links||[]).map(l=>l.insight).filter(Boolean);
  ins.innerHTML=`<h3>Çıkarımlar (${found.length}/${(c.inferences||[]).length})</h3>`+
    (found.length?found.map(f=>`<div class="panel" style="margin-bottom:8px;border-left:3px solid var(--amber)">${esc(f)}</div>`).join("")
      :"<div class='panel small muted'>Henüz çıkarım yok. Birbirini destekleyen iki kanıtı ipe bağla.</div>");
  v.appendChild(ins);
  setTimeout(drawLinks,0);

  function drawLinks(){
    const s=document.getElementById("boardSvg"); if(!s)return;
    s.innerHTML="";
    (cs.board.links||[]).forEach(l=>{
      const A=cs.board.pos[l.a],B=cs.board.pos[l.b]; if(!A||!B)return;
      const ln=document.createElementNS("http://www.w3.org/2000/svg","line");
      ln.setAttribute("x1",A.x+75);ln.setAttribute("y1",A.y+10);ln.setAttribute("x2",B.x+75);ln.setAttribute("y2",B.y+10);
      ln.setAttribute("stroke",l.insight?"#e0483c":"#8d3a33");ln.setAttribute("stroke-width",l.insight?2.5:1.6);
      ln.setAttribute("opacity",l.insight?".95":".6");
      s.appendChild(ln);
    });
  }
  function makeLink(a,b){
    if(cs.board.links.some(l=>(l.a===a&&l.b===b)||(l.a===b&&l.b===a))) return;
    const inf=(c.inferences||[]).find(x=>(x.a===a&&x.b===b)||(x.a===b&&x.b===a));
    cs.board.links.push({a,b,insight:inf?inf.t:null,note:""});
    if(inf){ S.points+=18; toast("ÇIKARIM: "+inf.t,"green"); sfx("stamp");
      const done=cs.board.links.filter(l=>l.insight).length;
      if(done>=2) unlockLayer("how");
      if(done>=4) unlockLayer("why");
      if(done>=1) unlockLayer("who");
    } else { toast("İp çekildi. Bu ikisi arasında güçlü bir bağ görünmüyor.","red"); }
    save();
  }
}

/* ---------------- NOT DEFTERİ + ŞİFRE ÇÖZÜCÜ ---------------- */
function viewNotes(v){
  const c=C(),cs=CS();
  const p=el("div","split");
  const left=el("div","panel");
  left.innerHTML=`<h3>Dedektif not defteri</h3>
    <p class="small muted">Teorini yaz. Otomatik kaydedilir.</p>
    <textarea class="f" id="nt" style="min-height:220px" placeholder="Kim? Nasıl? Neden? Hangi kanıt hangisini destekliyor?">${esc(cs.notes)}</textarea>

      <div class="small" style="color:var(--paper2)">${esc(cp.title)} <span class="tag">${esc(cp.type)}</span></div>
      <div class="doc" style="margin:6px 0;padding:10px"><b style="letter-spacing:3px">${esc(cp.cipher)}</b></div>
      ${cs.ciphers[cp.id]?`<div class="tag green">ÇÖZÜLDÜ: ${esc(cp.plain)}</div>`:
        `<input class="f" id="cp_${cp.id}" placeholder="çözümü yaz">
         <div class="row" style="margin-top:6px"><button class="btn sm" data-cp="${cp.id}">DENE</button>
         <button class="btn sm ghost" data-cph="${cp.id}">ADLİ DESTEK (-puan)</button></div>`}
    </div>`).join("")}
  </div>
  <div class="panel" style="margin-top:14px"><h3>Toplanan tüm kanıtlar (${Object.keys(cs.ev).length})</h3>
    <div class="grid" style="gap:8px" id="allev"></div></div>`;
  p.appendChild(left);p.appendChild(right);v.appendChild(p);
  setTimeout(()=>{
    const t=$("#nt",left); t.oninput=()=>{cs.notes=t.value;$("#ntinfo",left).textContent=t.value.length+" karakter · kaydedildi";save();};
    right.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>{
      const cp=c.ciphers.find(x=>x.id===b.dataset.cp);
      const val=($("#cp_"+cp.id,right).value||"").trim().toLowerCase();
      if(cp.accept.map(x=>x.toLowerCase()).includes(val)){
        cs.ciphers[cp.id]=true; S.points+=22; toast("ŞİFRE ÇÖZÜLDÜ","green"); if(cp.reward) addEv(cp.reward.id); save(); render();
      } else toast("Olmadı. İpucu: "+cp.help,"red");
    });
    right.querySelectorAll("[data-cph]").forEach(b=>b.onclick=()=>{
      const cp=c.ciphers.find(x=>x.id===b.dataset.cph);
      cs.ciphers[cp.id]=true; S.points=Math.max(0,S.points-15); cs.hints++;
      toast("Adli destek çözdü: "+cp.plain+" (puan düştü)","amber"); if(cp.reward) addEv(cp.reward.id); save(); render();
    });
    const box=$("#allev",right); Object.keys(cs.ev).forEach(id=>box.appendChild(evCard(id)));
  },0);
}

/* ---------------- YENİDEN CANLANDIRMA ---------------- */
function viewRecon(v){
  const c=C(),cs=CS();
  if(!cs.recon) cs.recon=shuffleArr(c.reconstruct.steps.map(s=>s.id));
  v.appendChild(el("div","sec",`<h1>Olayı yeniden canlandır</h1>
    <p class="muted small">Adımları doğru sıraya diz. Sıra doğruysa "NASIL" katmanı kesinleşir.</p>`));
  const list=el("div","panel");
  cs.recon.forEach((id,i)=>{
    const st=c.reconstruct.steps.find(s=>s.id===id);
    const d=el("div","recon-item"); d.draggable=true; d.dataset.id=id;
    d.innerHTML=`<span class="tag">${i+1}</span> ${esc(st.t)}`;
    d.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain",id);d.classList.add("dragging");});
    d.addEventListener("dragend",()=>d.classList.remove("dragging"));
    d.addEventListener("dragover",e=>e.preventDefault());
    d.addEventListener("drop",e=>{
      e.preventDefault(); const from=e.dataTransfer.getData("text/plain");
      const arr=cs.recon.filter(x=>x!==from); arr.splice(arr.indexOf(id),0,from); cs.recon=arr; save(); render();
    });
    list.appendChild(d);
  });
  v.appendChild(list);
  const row=el("div","row"); row.style.marginTop="12px";
  const chk=el("button","btn primary","SIRALAMAYI ONAYLA");
  chk.onclick=()=>{
    const ok=cs.recon.join(",")===c.reconstruct.steps.map(s=>s.id).join(",");
    if(ok){ cs.reconOk=true; S.points+=30; unlockLayer("how"); toast("Canlandırma doğru. Olay örgüsü kesinleşti.","green"); }
    else toast("Sıralama tutmuyor. Kanıtların zamanlarına tekrar bak.","red");
    save(); render();
  };
  row.appendChild(chk);
  if(cs.reconOk) row.appendChild(el("span","tag green","ONAYLANDI"));
  v.appendChild(row);
}

/* ---------------- ÇÖZÜM / İTHAM ---------------- */
function viewAccuse(v){
  const c=C(),cs=CS();
  if(cs.solved){ return viewEnding(v); }
  const missing=missingTabsFor(c);
  const req=requiredTabsFor(c);
  const missingTasks=missingTasksFor(c);
  const labelOf=k=>(TABS.find(t=>t.k===k)||{}).l || k.toUpperCase();
  v.appendChild(el("div","sec",`<h1>İtham</h1>
    <p class="muted small">Kim, nasıl ve neden sorularının üçünü de cevaplaman gerekiyor. Yetersiz kanıtla, eksik incelemeyle ya da yarım kalmış görevlerle savcılık dosyayı iade eder.</p>`));
  const checklist=el("div","panel");
  checklist.innerHTML=`<h3>İNCELEME KONTROL LİSTESİ</h3>
    <p class="small muted" style="margin-bottom:8px">Bu dosyayı kapatmadan önce aşağıdaki alanların hepsine en az bir kez uğramalısın.</p>
    <div class="grid g3">${req.map(k=>`<div class="kv"><span>${esc(labelOf(k))}</span><b style="color:${missing.includes(k)?"var(--red2)":"var(--green)"}">${missing.includes(k)?"ZİYARET EDİLMEDİ":"TAMAMLANDI"}</b></div>`).join("")}</div>
    <h3 style="margin-top:16px">ÇÖZÜLMESİ GEREKEN GÖREVLER</h3>
    <p class="small muted" style="margin-bottom:8px">Bunlar sadece "ziyaret" değil — gerçekten sonuçlandırılmalı.</p>
    <div class="tasklist">${solveTasksFor(c).map(t=>`<div class="kv"><span>${esc(t.label)}</span><b style="color:${t.done?"var(--green)":"var(--red2)"}">${t.done?"TAMAMLANDI":"EKSİK"}</b></div>`).join("")}</div>`;
  v.appendChild(checklist);
  const p=el("div","panel");
  p.innerHTML=`<h3>1 · KİM</h3>
    <select class="f" id="aWho"><option value="">— seç —</option>${c.suspects.map(s=>`<option value="${s.id}">${esc(s.name)} — ${esc(s.role)}</option>`).join("")}</select>
    <h3 style="margin-top:16px">2 · NASIL</h3>
    <select class="f" id="aHow"><option value="">— seç —</option>${c.solution.howOptions.map(o=>`<option value="${o.id}">${esc(o.t)}</option>`).join("")}</select>
    <h3 style="margin-top:16px">3 · NEDEN</h3>
    <select class="f" id="aWhy"><option value="">— seç —</option>${c.solution.whyOptions.map(o=>`<option value="${o.id}">${esc(o.t)}</option>`).join("")}</select>
    <h3 style="margin-top:16px">4 · SUNULAN KANITLAR</h3>
    <div class="grid g3" id="evPick"></div>
    <div class="row" style="margin-top:16px"><button class="btn primary" id="doAccuse">DOSYAYI SAVCILIĞA SUN</button>
    <span class="small muted">${S.hard?"ZOR MOD: tek hakkın var.":"Yanlış itham rütbe kaybettirir."}</span></div>`;
  v.appendChild(p);
  const picked={};
  setTimeout(()=>{
    const box=$("#evPick",p);
    Object.keys(cs.ev).forEach(id=>{
      const e=evOf(id); const d=el("div","ecard");
      d.innerHTML=`<div class="et">${esc(e.title)}</div><div class="ed">${esc(e.type)}</div>`;
      d.onclick=()=>{ picked[id]=!picked[id]; d.style.borderColor=picked[id]?"var(--amber)":""; d.style.background=picked[id]?"#2a2318":""; };
      box.appendChild(d);
    });
    if(!Object.keys(cs.ev).length) box.innerHTML="<div class='small muted'>Kanıt yok.</div>";
    $("#doAccuse",p).onclick=()=>{
      const who=$("#aWho",p).value,how=$("#aHow",p).value,why=$("#aWhy",p).value;
      if(!who||!how||!why){ toast("Üç soruyu da cevaplamalısın.","red"); return; }
      const stillMissing=missingTabsFor(c);
      if(stillMissing.length){
        toast("Önce şu alanları incele: "+stillMissing.map(labelOf).join(", "),"red");
        return;
      }
      const stillMissingTasks=missingTasksFor(c);
      if(stillMissingTasks.length){
        toast("Eksik görev: "+stillMissingTasks[0].label,"red");
        return;
      }
      const need=c.solution.needEvidence.filter(x=>picked[x]).length;
      const sol=c.solution;
      const totalNeed=sol.needEvidence.length;
      let kind;
      if(who!==sol.who) kind="wrong";
      else if(need<totalNeed) kind="noevidence";
      else if(how===sol.how&&why===sol.why) kind="perfect";
      else kind="who_only";
      finish(kind,{who,how,why});
    };
  },0);
}

function finish(kind,ans){
  const c=C(),cs=CS();
  cs.solved={kind,ans,at:Date.now(),dur:Math.round((Date.now()-cs.started)/1000)};
  if(kind==="perfect"){ S.points+=180; S.stats.solved++; S.solvedCases[c.id]=true; S.badges["solved_"+c.id]=true; }
  else if(kind==="who_only"){ S.points+=70; S.solvedCases[c.id]=true; }
  else if(kind==="wrong"){ S.points=Math.max(0,S.points-60); S.stats.wrong++; }
  else S.points+=20;
  sfx("stamp"); save(); setTab("accuse");
}

  mk("SOĞUK DOSYA","Eksik kanıtlı eski vaka; belirsizlikle çalışmak.","SOĞUK DOSYAYI AÇ",()=>{S.caseId="c2";S.hard=true;toast("Soğuk dosya modu: kanıtların bir kısmı zaten kaybolmuş sayılır.","amber");save();setTab("brief");});
  mk("KARŞI-TARAF MODU","Önce iz temizleyen taraf ol, sonra aynı vakayı çöz.","BAŞLAT",()=>counterMode());
  v.appendChild(g);
}

/* ---------- ZAMAN YARIŞI MODU ---------- */
function timeLeftLabel(){
  if(!S.timedCase) return "";
  const left=Math.max(0,S.timedCase.deadline-Date.now());
  const m=Math.floor(left/60000), s=Math.floor((left%60000)/1000);
  return m+":"+String(s).padStart(2,"0");
}
function startTimedRace(){
  S.timedCase={deadline:Date.now()+45*60*1000,caseId:S.caseId||"c1"};
  S.caseId=S.timedCase.caseId; S.cases[S.caseId]=freshCaseState();
  save();
  toast("ZAMAN YARIŞI BAŞLADI — 45 dakikan var. Sayaç arka planda işler.","red");
  setTab("brief");
}
function checkTimedRace(){
  if(!S.timedCase) return;
  const left=S.timedCase.deadline-Date.now();
  if(left<=0){
    const c=CASES.find(x=>x.id===S.timedCase.caseId);
    const cs=S.cases[S.timedCase.caseId];
    if(cs && !cs.solved){
      cs.solved={kind:"noevidence",ans:{},at:Date.now(),dur:0,timedOut:true};
      S.stats.wrong++;
    }
    S.timedCase=null; save();
    toast("SÜRE DOLDU — dosya otomatik iade edildi.","red");
  }
}
setInterval(()=>{ if(S.timedCase){ checkTimedRace(); if($("#raceClock")) $("#raceClock").textContent=timeLeftLabel(); } },1000);


function dailyCase(){
  const today=new Date().toDateString();
  const r=Math.abs(hash(today))%GEN.objects.length;
  const obj=GEN.objects[r],t=GEN.times[r%GEN.times.length],mv=GEN.motives[(r+2)%GEN.motives.length];
  const names=[GEN.names[r%8],GEN.names[(r+3)%8],GEN.names[(r+5)%8]];
  const answer=names[r%3];
  const {bg}=modal(`<h2>GÜNLÜK DOSYA — ${esc(today)}</h2>
    <div class="doc"><h4>Tek soruluk dosya</h4><div class="meta">SERİ: ${S.streak} gün</div>
    <p>Saat ${esc(t)}'de bir ${esc(obj)} bulundu. Üç kişi olay yerine yakındı. Saik: ${esc(mv)}.</p>
    <p><b>${esc(names[0])}</b>: "Ben ${esc(t)}'de evdeydim." <br>
       <b>${esc(names[1])}</b>: "${esc(names[0])} ile birlikteydim." <br>
       <b>${esc(names[2])}</b>: "İkisini de ${esc(t)}'de dışarıda gördüm."</p>
    <p class="small">İki ifade birbirini destekliyor, biri ikisini de yalanlıyor. Yalancı tek kişiyse kim olamaz?</p></div>
    <div class="row" style="margin-top:12px">${names.map(n=>`<button class="btn" data-d="${esc(n)}">${esc(n)}</button>`).join("")}</div>`);
  setTimeout(()=>{
    bg.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{
      const ok=b.dataset.d===answer;
      if(S.lastDaily!==today){ S.streak=ok?S.streak+1:0; S.lastDaily=today; S.points+=ok?40:0; }
      toast(ok?"Doğru. Seri: "+S.streak:"Yanlış. Seri sıfırlandı.",ok?"green":"red");
      save(); bg.remove(); render();
    });
  },0);
}
function hash(s){ let h=0; for(let i=0;i<s.length;i++){h=(h<<5)-h+s.charCodeAt(i);h|=0;} return h; }

function endlessCase(){
  const p=a=>a[Math.floor(Math.random()*a.length)];
  const sus=[p(GEN.names),p(GEN.names),p(GEN.names),p(GEN.names)].filter((x,i,a)=>a.indexOf(x)===i);
  const guilty=p(sus), place=p(GEN.places), obj=p(GEN.objects), mot=p(GEN.motives), tm=p(GEN.times);
  const {bg}=modal(`<h2>SONSUZ MOD — ÜRETİLEN DOSYA</h2>
    <div class="doc"><h4>${esc(place.toUpperCase())} DOSYASI</h4><div class="meta">SAAT ${esc(tm)} · SAİK: ${esc(mot)}</div>
    <p>Olay yerinde bir ${esc(obj)} bulundu. Şüpheliler:</p>
    <ul style="font-size:12px">${sus.map((s,i)=>`<li><b>${esc(s)}</b> — ${esc(GEN.roles[i%GEN.roles.length])}: "${i===sus.indexOf(guilty)?"O saatte "+tm+"'de uyuyordum, kimse görmedi.":"Saat "+tm+"'de "+p(GEN.places)+" civarındaydım, tanığım var."}"</li>`).join("")}</ul>
    <p class="small">Tek kişinin tanığı yok. Kanıt zinciri kısa: doğrudan seç.</p></div>
    <div class="row" style="margin-top:12px">${sus.map(s=>`<button class="btn" data-e="${esc(s)}">${esc(s)}</button>`).join("")}</div>`);
  setTimeout(()=>{ bg.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{
    const ok=b.dataset.e===guilty; S.points+=ok?30:0;
    toast(ok?"Doğru fail. +30 puan":"Yanlış. Gerçek fail: "+guilty,ok?"green":"red"); save(); bg.remove(); render(); });},0);
}

function examMode(){
  const c=C();
  const items=Object.values(evCatalog(c)).slice(0,6);
  const {bg}=modal(`<h2>SINAV MODU — ÇELİŞKİ AVI</h2>
    <p class="small muted">Aşağıdaki belgelerden hangisi diğerleriyle çelişen bilgiyi taşıyor?</p>
    ${items.map((e,i)=>`<button class="choice" data-x="${i}"><span class="tone">${esc(e.type)}</span>${esc(e.title)} — ${esc((e.body||"").slice(0,110))}…</button>`).join("")}`);
  const right=items.findIndex(e=>/çelişk|yalanl|aksine|uyuşmuyor|beyanının/i.test(e.body||""));
  setTimeout(()=>{ bg.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{
    const ok=+b.dataset.x===(right<0?0:right); S.points+=ok?15:0;
    toast(ok?"Doğru tespit.":"Bu belge tutarlı. Tekrar bak.",ok?"green":"red"); bg.remove(); save(); });},0);
}

function counterMode(){
  const {bg}=modal(`<h2>KARŞI-TARAF MODU</h2>
    <p class="small muted">Bu bölümde failsin. Üç izden hangisini temizlersin? Seçimin, dedektif tarafında oynadığında dosyaya yansır.</p>
    <button class="choice" data-c="glass"><span class="tone">İZ 1</span>Kadehteki parmak izini sil</button>
    <button class="choice" data-c="cam"><span class="tone">İZ 2</span>Kamera kaydını sildir</button>
    <button class="choice" data-c="pen"><span class="tone">İZ 3</span>Enjektörü binadan uzaklaştır</button>`);
  setTimeout(()=>{ bg.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{
    S.badges["counter_"+b.dataset.c]=true; S.points+=15;
    toast("İz temizlendi. Dedektif tarafında bu kanıt daha zor bulunacak.","amber"); save(); bg.remove(); });},0);
}

function buroSezon(v){
  v.appendChild(el("div","sec",`<h1>${esc(SEASON.name)}</h1><p class="muted small">${esc(SEASON.desc)}</p>`));
  const g=el("div","grid g2");
  SEASON.eps.forEach(e=>{
    const d=el("div","panel"+(e.soon?" locked":""));
    d.innerHTML=`<div class="row" style="justify-content:space-between"><b style="color:var(--paper)">BÖLÜM ${e.n} — ${esc(e.t)}</b>
      ${e.premium?'<span class="tag amber">PREMIUM</span>':""}</div>
      <div class="small muted" style="margin-top:6px">${e.soon?"Yakında — sezon ilerledikçe açılır.":"Bu bölüm oynanabilir."}</div>
      ${e.id?`<button class="btn sm" data-ep="${e.id}" style="margin-top:8px">AÇ</button>`:""}`;
    g.appendChild(d);
  });
  v.appendChild(g);
  setTimeout(()=>{ g.querySelectorAll("[data-ep]").forEach(b=>b.onclick=()=>{S.caseId=b.dataset.ep;save();setTab("brief");}); },0);
}

function buroProfil(v){
  const r=rank();
  v.appendChild(el("div","sec",`<h1>Dedektif kimliği</h1>`));
  const p=el("div","panel");
  p.innerHTML=`<div class="row" style="gap:16px;align-items:flex-start">
      <div class="portrait" style="width:84px;height:104px">${portraitSVG({portrait:{skin:"#b98f6c",hair:"#2a2119"}})}</div>
      <div><div style="font-size:18px;color:var(--paper);letter-spacing:2px">${esc(r.n)}</div>
      <div class="small muted">SİCİL NO: ${(1000+S.points).toString(16).toUpperCase()}</div>
      <div class="small muted">Toplam puan: ${S.points}</div></div></div>
    <div class="grid g4" style="margin-top:14px">
      <div class="stat"><div class="n">${S.stats.solved}</div><div class="l">Çözülen</div></div>
      <div class="stat"><div class="n">${S.stats.wrong}</div><div class="l">Yanlış itham</div></div>
      <div class="stat"><div class="n">${S.streak}</div><div class="l">Günlük seri</div></div>
      <div class="stat"><div class="n">${Object.keys(S.badges).length}</div><div class="l">Rozet</div></div>
    </div>
    <hr class="rule"><h3>Rozetler</h3>
    <div class="row">${[["solved_c1","SESSİZ KAT ÇÖZÜLDÜ"],["solved_c2","SON VAPUR ÇÖZÜLDÜ"],["solved_c3","KIRIK HESAP ÇÖZÜLDÜ"],
      ["counter_glass","İZ TEMİZLEYİCİ"],["counter_cam","KAYIT SİLİCİ"],["counter_pen","SESSİZ TAŞIYICI"]]
      .map(([k,l])=>`<span class="badge ${S.badges[k]?"got":""}">${S.badges[k]?"&#9679;":"&#9675;"} ${l}</span>`).join("")}</div>
    <hr class="rule"><div class="row"><button class="btn sm" id="resetAll">TÜM İLERLEMEYİ SIFIRLA</button></div>`;
  v.appendChild(p);
  setTimeout(()=>{ $("#resetAll",p).onclick=()=>{ if(confirm("Tüm dosyalar ve rütbe sıfırlansın mı?")){ localStorage.removeItem(SAVE_KEY); load(); setTab("brief"); } }; },0);
}

/* ---------------- KADEMELİ İPUCU ---------------- */
function askHint(){
  const c=C(),cs=CS();
  if(S.hard){ toast("Zor modda ipucu yok. Yemin ettin.","red"); return; }
  const lvl=Math.min(3,cs.hints+1);
  const tips={
    c1:["Enjektörün neden boş olduğunu sorgula: kutu masada, cihaz çöpte.",
        "Kamera 23:52 karesini kontrast ile incele ve baz istasyonu sorgusunu laboratuvara ver.",
        "Fail iş ortağı. Yöntem: fıstıklı sos + önceden boşaltılmış enjektör. Saik: sahte imzalı ihale dosyasının ifşası."],
    c2:["Kameraların görmediği bir çıkış var: arka rampa.",
        "Korkuluktaki lacivert yünü meslektaşın montuyla karşılaştır ve rampa defterini sor.",
        "Fail meslektaş. Yöntem: kör noktadaki rampadan zorla indirme. Saik: sınav sorusu satışının ifşası."],
    c3:["Log'ları yazan kişiyle denetlenen kişi aynı olamaz.",
        "Kapatılmamış bakım hesabını ve yeniden yazılmış log imzasını birleştir.",
        "Fail sistem yöneticisi. Yöntem: eski servis hesabı + log manipülasyonu. Saik: kardeşinin hesabına zimmet."]
  }[c.id];
  cs.hints++; S.points=Math.max(0,S.points-(lvl*12)); S.stats.hints++;
  modal(`<h2>İPUCU — SEVİYE ${lvl}/3</h2><div class="doc"><h4>Kademeli yönlendirme</h4>
    <div class="meta">Her seviye puan düşürür</div><p>${esc(tips[lvl-1])}</p></div>
    <p class="small muted" style="margin-top:10px">Kalan seviye: ${3-lvl}</p>`);
  save(); render();
}

/* ---------------- AÇILIŞ ---------------- */
function boot(){
  load();
  document.getElementById("btnHint").onclick=askHint;
  document.getElementById("btnSound").onclick=()=>{ S.sound=!S.sound; if(S.sound){ac().resume&&ac().resume();startAmbient();}else stopAmbient(); save(); header(); };
  document.getElementById("btnFlair").onclick=()=>{ S.flair=!S.flair; save(); header(); };
  document.getElementById("btnMenu").onclick=()=>{ buroTab="arsiv"; setTab("buro"); };
  document.addEventListener("keydown",e=>{
    if(e.target.matches("input,textarea,select")) return;
    const n=parseInt(e.key,10);
    if(!isNaN(n)&&n>=1&&n<=9) setTab(TABS[n-1].k);
    if(e.key==="h") askHint();
  });
  render();
  if(!S.seenIntro){ S.seenIntro=true; save();
    setTimeout(()=>toast("Ses tasarımı kapalı başlar. Üst çubuktan açabilirsin.","amber"),1600);
  }
  scheduleCuriosity();
}
boot();

function procState(sid){
  const cs=CS(); cs.proc=cs.proc||{};
  if(!cs.proc[sid]) cs.proc[sid]={route:0,asked:{},pressure:0,contra:[]};
  return cs.proc[sid];
}
function procQuestions(sid){
  const c=C(), s=c.suspects.find(x=>x.id===sid); if(!s) return [];
  const st=procState(sid);
  const r=rng(hashStr(c.id+"|"+sid+"|r"+st.route));
  const pool=Q_TEMPLATES.slice();
  const out=[];
  const n=4+Math.floor(r()*2);
  const dep=SUS_DEPTH[sid]||{};
  const histPool=(s.hist||[]).concat(dep.hist||[]);
  const contraPool=(s.contra||[]).concat(dep.contra||[]);
  for(let i=0;i<n&&pool.length;i++){
    const idx=Math.floor(r()*pool.length); const t=pool.splice(idx,1)[0];
    const ctx={
      hist: histPool.length? histPool[Math.floor(r()*histPool.length)] : "geçmişinizdeki bir ayrıntı",
      contra: contraPool.length? contraPool[Math.floor(r()*contraPool.length)] : null,
      hist2: histPool.length>1? histPool[Math.floor(r()*histPool.length)] : null
    };
    out.push({key:"p"+st.route+"_"+i,tone:t.tone,q:t.q(s,ctx),a:t.a(s,ctx),note:t.note(s,ctx),contra:!!t.contra});
  }
  return out;
}
function procAsk(sid,q){
  const c=C(),cs=CS(),st=procState(sid),s=c.suspects.find(x=>x.id===sid);
  if(st.asked[q.key]) return;
  st.asked[q.key]={q:q.q,a:q.a,note:q.note,tone:q.tone,contra:false};
  st.pressure=Math.min(100,st.pressure+(q.contra?22:12));
  S.points+=4;
  // yeni çelişki açılımı
  const lines=(s.contra||[]).concat((SUS_DEPTH[sid]||{}).contra||[]);
  if(q.contra && st.contra.length<lines.length && st.pressure>=30){
    const line=lines[st.contra.length]; st.contra.push(line);
    st.asked[q.key].contra=line;
    const id="proc_"+sid+"_"+st.contra.length;
    regEv(c,id,{title:"Çelişki dökümü — "+s.name+" #"+st.contra.length,type:"İfade çelişkisi",
      body:line+" (Sorgu rotası "+(st.route+1)+", baskı seviyesi %"+st.pressure+")"});
    addEv(id);
    toast("YENİ ÇELİŞKİ AÇILDI — "+s.name,"red"); sfx("stamp");
  } else sfx("type");
  if(st.pressure>=70 && !st.broke){ st.broke=true; S.points+=15; toast("Şüpheli kırılma noktasında: yüzleştirme soruları artık daha etkili.","amber"); }
  save();
}
function newRoute(sid){
  const st=procState(sid);
  st.route=(st.route+1)%6; st.pressure=Math.max(0,st.pressure-10);
  toast("YENİ SORU ROTASI AÇILDI — rota "+(st.route+1)+"/6. Farklı sorular, farklı açılımlar.","amber");
  save(); render();
}

function coachRender(){
  const old=document.getElementById("coach"); if(old) old.remove();
  if(C().id!=="c0" || S.coachOff) return;

  const d=el("div","coach"); d.id="coach";
  d.innerHTML=`<div class="k">EĞİTİM REHBERİ · ADIM ${i+1}/${COACH_STEPS.length}</div>

let interroTone="HEPSİ";
function viewInterro(v){
  const c=C(),cs=CS();
  const cur=window.__interro||c.suspects[0].id;
  const s=suspectOf(cur), st=procState(cur);
  hd(v,"SORGU ODASI · KAYIT AÇIK","Sorgu",

  rack.innerHTML=`<span class="lb">ŞÜPHELİ</span>`;
  const seg=el("div","seg");
  c.suspects.forEach(x=>{ const b=el("button",x.id===cur?"on":"",esc(x.name.split(" ")[0])); b.onclick=()=>{window.__interro=x.id;render();}; seg.appendChild(b); });
  rack.appendChild(seg);
  rack.appendChild(el("span","lb","TON"));
  const seg2=el("div","seg");
  ["HEPSİ","BASKI","EMPATİ","BLÖF","TEKNİK","SAKİN","SESSİZLİK","YÜZLEŞTİR"].forEach(t=>{
    const b=el("button",interroTone===t?"on":"",t); b.onclick=()=>{interroTone=t;render();}; seg2.appendChild(b);
  });
  rack.appendChild(seg2);
  const nb=el("button","btn sm","YENİ SORU ROTASI ("+(st.route+1)+"/6)"); nb.onclick=()=>newRoute(cur);
  rack.appendChild(nb);
  v.appendChild(rack);

  if(st.lockUntil && st.lockUntil>Date.now()){
    const banner=el("div","panel","<b style='color:var(--red2)'>ŞÜPHELİ ŞU AN KONUŞMUYOR</b> — yanlış/alakasız bir kanıt sunuldu, savunmaya geçti. Diğer şüphelilerle devam edebilirsin.");
    banner.style.marginBottom="14px"; banner.style.borderLeft="2px solid var(--red)";
    v.appendChild(banner);
  }
  const locked = st.lockUntil && st.lockUntil>Date.now();

  const grid=el("div","iq");
  const left=el("div","");
  const fixed=(c.interrogation[cur]||[]);
  const asked=cs.asked[cur]||[];
  const proc=procQuestions(cur);

  const qbox=el("div","panel");
  qbox.innerHTML=`<h3>Dosya soruları</h3>`;
  let shown=0;
  fixed.forEach((q,i)=>{
    if(interroTone!=="HEPSİ" && q.tone!==interroTone) return;
    shown++;
    const used=asked.includes(i), qlocked=q.requires&&!has(q.requires);
    const b=el("button","qcard"+(used?" used":"")+(qlocked||locked?" lock":""));
    b.innerHTML=`<span class="tn ${esc(q.tone)}">${esc(q.tone)}</span><span class="rt">${used?"SORULDU":locked?"SUSUYOR":qlocked?"KİLİTLİ":"DOSYA HATTI"}</span>
      <span class="qt">${esc(q.q)}</span>`;
    b.onclick=()=>{
      if(used){toast("Bu soru soruldu.","red");return;}
      if(locked){toast("Şüpheli şu an konuşmuyor.","red");return;}
      if(qlocked){toast("Bu soru için önce ilgili kanıta ulaşmalısın.","red");return;}
      (cs.asked[cur]=cs.asked[cur]||[]).push(i); S.points+=4;
      st.pressure=Math.min(100,st.pressure+14);
      if(q.gives) addEv(q.gives);
      if(q.layer) unlockLayer(q.layer);
      if(q.contradicts) toast("ÇELİŞKİ: bu ifade laboratuvar sonucuyla uyuşmuyor.","red");
      sfx("stamp"); save(); render();
    };
    qbox.appendChild(b);
  });
  if(!shown) qbox.appendChild(el("p","small muted","Bu tonda dosya sorusu yok."));

  const pbox=el("div","panel"); pbox.style.marginTop="14px";
  pbox.innerHTML=`<h3>Prosedürel hat — rota ${st.route+1}</h3>
    <p class="small muted">Bu sorular şüphelinin dosyasından üretildi. Rota değiştirdiğinde tamamen farklı bir hat gelir.</p>`;
  let pshown=0;
  proc.forEach(q=>{
    if(interroTone!=="HEPSİ" && q.tone!==interroTone) return;
    pshown++;
    const used=!!st.asked[q.key];
    const b=el("button","qcard"+(used?" used":"")+(locked?" lock":""));
    b.innerHTML=`<span class="tn ${esc(q.tone)}">${esc(q.tone)}</span><span class="rt">${used?"SORULDU":q.contra?"ÇELİŞKİ AÇABİLİR":"ÜRETİLDİ"}</span>
      <span class="qt">${esc(q.q)}</span>`;
    b.onclick=()=>{ if(used){toast("Bu soru soruldu.","red");return;} if(locked){toast("Şüpheli şu an konuşmuyor.","red");return;} procAsk(cur,q); render(); };
    pbox.appendChild(b);
  });
  if(!pshown) pbox.appendChild(el("p","small muted","Bu tonda üretilmiş soru yok — tonu değiştir ya da rotayı yenile."));

  const tr=el("div","panel"); tr.style.marginTop="14px";
  tr.innerHTML="<h3>İfade transkripti</h3>";
  let any=false;
  asked.forEach(i=>{ const q=fixed[i]; if(!q)return; any=true;
    tr.innerHTML+=`<div class="tscript"><span class="q">D: ${esc(q.q)}</span>
      <span class="a">${esc(q.a)}</span><div class="n">NOT: ${esc(q.note)}</div></div>`;});
  Object.values(st.asked).forEach(a=>{ any=true;
    tr.innerHTML+=`<div class="tscript ${a.contra?"contra":""}"><span class="q">D: ${esc(a.q)}</span>
      <span class="a">${esc(a.a)}</span><div class="n">NOT: ${esc(a.note)}</div>
      ${a.contra?`<div class="small" style="color:var(--red2);margin-top:5px">AÇILAN ÇELİŞKİ: ${esc(a.contra)}</div>`:""}</div>`;});
  if(!any) tr.innerHTML+="<p class='small muted'>Henüz soru sorulmadı.</p>";
  left.appendChild(qbox); left.appendChild(pbox); left.appendChild(tr);

  const right=el("div","");
  const confront=evList().slice(0,14);
  right.innerHTML=`<div class="panel"><div class="row" style="gap:11px">
      <div class="portrait" style="width:58px;height:72px">${portraitSVG(s)}</div>
      <div style="min-width:0"><div style="color:var(--paper)">${esc(s.name)}</div>
      <div class="small muted">${esc(s.role)}</div>
      <div class="small muted" style="margin-top:3px">Sorulan: ${asked.length+Object.keys(st.asked).length}</div></div></div>
    <hr class="rule">
    <div class="small muted">BASKI SEVİYESİ · %${st.pressure}</div>
    <div class="gauge"><i style="width:${st.pressure}%"></i></div>
    <div class="small" style="margin-top:6px;color:${st.pressure>=70?"var(--red2)":"var(--dim)"}">
      ${st.pressure<25?"Sakin, hazırlıklı cevaplar.":st.pressure<50?"Duraksamalar başladı.":st.pressure<70?"Savunma çatlıyor.":"Kırılma noktası: yüzleştirme zamanı."}</div>
    <div class="small muted" style="margin-top:8px">AÇILAN ÇELİŞKİ: <b>${st.contra.length}</b></div>
    </div>
    <div class="panel" style="margin-top:14px"><h3>İfadeyi yüzüne vur</h3>
      <p class="small muted">Bir kanıtı doğrudan sun; baskı yükselir. <b style="color:var(--red2)">Ama alakasız bir kanıt sunarsan şüpheli savunmaya geçer ve seni bir süre susturur.</b></p>
      <div class="row" id="cfr">${confront.map(e=>`<button class="btn sm ghost" data-cf="${esc(e.id)}" ${st.lockUntil&&st.lockUntil>Date.now()?"disabled":""}>${esc(e.title)}</button>`).join("")||"<span class='small muted'>Kanıt yok</span>"}</div>
      ${st.lockUntil&&st.lockUntil>Date.now()?`<div class="small" style="color:var(--red2);margin-top:8px" id="lockClock">ŞÜPHELİ SUSUYOR — ${Math.ceil((st.lockUntil-Date.now())/1000)} sn</div>`:""}
    </div>`;
  grid.appendChild(left); grid.appendChild(right); v.appendChild(grid);
  if(st.lockUntil&&st.lockUntil>Date.now()){
    const lc=$("#lockClock",right);
    const iv=setInterval(()=>{
      const left=Math.ceil((st.lockUntil-Date.now())/1000);
      if(left<=0){ clearInterval(iv); render(); return; }
      if(lc) lc.textContent="ŞÜPHELİ SUSUYOR — "+left+" sn";
    },500);
  }
  setTimeout(()=>{
    right.querySelectorAll("[data-cf]").forEach(b=>b.onclick=()=>{
      if(st.lockUntil && st.lockUntil>Date.now()){ toast("Şüpheli şu an konuşmuyor. Bekle.","red"); return; }
      const e=evOf(b.dataset.cf); if(!e)return;
      const sol=c.solution||{};
      const isKeyEvidence = (sol.needEvidence||[]).includes(e.id);
      if(!isKeyEvidence){
        // alakasız/yanlış kanıt: ceza — şüpheli susar, baskı düşer (Uzman modunda 2 kat)
        const lockSec = S.expert? 90 : 45;
        st.strikes=(st.strikes||0)+1;
        st.pressure=Math.max(0,st.pressure-15);
        st.lockUntil=Date.now()+lockSec*1000;
        toast("YANLIŞ KANIT — şüpheli savunmaya geçti, "+lockSec+" saniye konuşmuyor. ("+st.strikes+". hatalı sunum)","red");
        sfx("stamp"); save(); render();
        return;
      }
      st.pressure=Math.min(100,st.pressure+18);
      const key="cf_"+e.id;
      if(!st.asked[key]){
        st.asked[key]={q:"Bunu masaya koyuyorum: "+e.title+". Açıklayın.",tone:"YÜZLEŞTİR",
          a:st.pressure>=60?"“...Tamam. Bir şeyi eksik anlattım.”":"“Bu beni bağlamaz. Başka sorunuz var mı?”",
          note:st.pressure>=60?"Kırıldı: ek beyan geliyor.":"Kanıtı reddetti; baskıyı sürdür.",contra:false};
        S.points+=5;
        if(st.pressure>=60){
          const lines=(s.contra||[]).concat((SUS_DEPTH[cur]||{}).contra||[]);
          if(st.contra.length<lines.length){
            const line=lines[st.contra.length]; st.contra.push(line);
            st.asked[key].contra=line;
            const id="proc_"+cur+"_c"+st.contra.length;
            regEv(c,id,{title:"Yüzleştirme çelişkisi — "+s.name,type:"İfade çelişkisi",body:line});
            addEv(id); toast("YÜZLEŞTİRME İŞE YARADI — yeni çelişki","red");
          }
        }
      }
      sfx("stamp"); save(); render();
    });
  },0);
}

let netSel=null;
function viewNetwork(v){
  const c=C(),n=c.network;
  const nodes=n.nodes.slice();
  (c.suspects||[]).forEach(s=>{ if(!nodes.find(x=>x.id===s.id)) nodes.push({id:s.id,label:s.name}); });
  const others=nodes.filter(x=>!x.victim), vic=nodes.find(x=>x.victim)||nodes[0];
  hd(v,"BAĞLANTI ANALİZİ","İlişki ağı",
    "Kurban merkezde. Kesintili hatlar kilitli: ilgili kanıtı bulduğunda açılır. Kırmızı hat doğrudan çatışma anlamına gelir.",
    `<span class="tag">${others.length} KİŞİ</span><span class="tag red">${n.links.filter(l=>l.red).length} ÇATIŞMA</span>`);
  const wrap=el("div","netwrap");
  const stage=el("div","netstage");
  const pos={};
  pos[vic.id]={x:50,y:46};
  const R=34, Ry=33;
  others.forEach((nd,i)=>{
    const a=(-Math.PI/2)+(i/others.length)*Math.PI*2;
    pos[nd.id]={x:50+Math.cos(a)*R,y:46+Math.sin(a)*Ry};
  });
  const NS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("style","position:absolute;inset:0;width:100%;height:100%");
  svg.setAttribute("viewBox","0 0 100 100"); svg.setAttribute("preserveAspectRatio","none");
  const links=n.links.filter(l=>pos[l.a]&&pos[l.b]);
  const pairSeen={};
  links.forEach(lk=>{
    const open=!lk.locked||has(lk.locked);
    const A=pos[lk.a],B=pos[lk.b];
    const pairKey=[lk.a,lk.b].slice().sort().join("|");
    const pairIdx=pairSeen[pairKey]=(pairSeen[pairKey]||0)+1;
    const spread=(pairIdx-1)*3.4; // aynı çiftte 2. ve sonraki bağlantılar için dikey ayraç
    const mx=(A.x+B.x)/2+(B.y-A.y)*.10, my=(A.y+B.y)/2-(B.x-A.x)*.10;
    const p=document.createElementNS(NS,"path");
    p.setAttribute("d",`M${A.x} ${A.y} Q${mx} ${my} ${B.x} ${B.y}`);
    p.setAttribute("fill","none");
    p.setAttribute("stroke",open?(lk.red?"#b8332a":"#6b5f4e"):"#2c2721");
    p.setAttribute("stroke-width",open?(lk.red?".55":".38"):".25");
    p.setAttribute("vector-effect","non-scaling-stroke");
    if(!open) p.setAttribute("stroke-dasharray","1.4 1.6");
    if(netSel && lk.a!==netSel && lk.b!==netSel) p.setAttribute("opacity",".18");
    const titleEl=document.createElementNS(NS,"title");
    titleEl.textContent=open?lk.label:"kilitli bağlantı — ilgili kanıt gerekiyor";
    p.appendChild(titleEl);
    svg.appendChild(p);
    // Yoğun ağlarda etiket çakışmasını önlemek için: varsayılan görünümde sadece
    // kurbana doğrudan bağlı "ışın" etiketleri gösterilir (bunlar dairesel olarak
    // doğal biçimde ayrışır). Çapraz bağlantı etiketleri ancak biri seçiliyken görünür.
    const isSpoke = lk.a==="victim"||lk.b==="victim";
    const shouldLabel = isSpoke || (netSel && (lk.a===netSel||lk.b===netSel));
    // Işın etiketlerini tam ortadan değil, dış düğüme yakın bir noktaya yerleştir —
    // dış halkada düğümler zaten birbirinden uzak olduğu için etiketler de ayrışır.
    let lx=mx, ly=my;
    if(isSpoke){
      const outer = lk.a==="victim"?B:A, inner = lk.a==="victim"?A:B;
      const dx=outer.x-inner.x, dy=outer.y-inner.y, len=Math.hypot(dx,dy)||1;
      const px=-dy/len, py=dx/len; // çizgiye dik birim vektör
      lx = inner.x+dx*0.55 + px*spread; ly = inner.y+dy*0.55 + py*spread;
    }
    if(shouldLabel){
      const t=document.createElementNS(NS,"text");
      t.setAttribute("x",lx); t.setAttribute("y",ly-1.6);
      t.setAttribute("fill",open?(lk.red?"#d98b83":"#9a8f7b"):"#3a342c");
      t.setAttribute("font-size","1.8"); t.setAttribute("text-anchor","middle"); t.setAttribute("font-family","monospace");
      t.setAttribute("paint-order","stroke"); t.setAttribute("stroke","#111010");
      t.setAttribute("stroke-width","2.6"); t.setAttribute("stroke-linejoin","round");
      if(netSel && lk.a!==netSel && lk.b!==netSel) t.setAttribute("opacity",".15");
      t.textContent=open?lk.label:"kilitli bağlantı";
      svg.appendChild(t);
    } else {
      const dot=document.createElementNS(NS,"circle");
      dot.setAttribute("cx",mx); dot.setAttribute("cy",my); dot.setAttribute("r",".7");
      dot.setAttribute("fill",open?(lk.red?"#b8332a":"#6b5f4e"):"#2c2721");
      svg.appendChild(dot);
    }
  });
  stage.appendChild(svg);
  nodes.forEach(nd=>{
    const s=suspectOf(nd.id);
    const connected = netSel? (nd.id===netSel || links.some(l=>(l.a===netSel&&l.b===nd.id)||(l.b===netSel&&l.a===nd.id))) : true;
    const d=el("div","nn"+(nd.victim?" victim":"")+(netSel===nd.id?" sel":"")+(connected?"":" dim"));
    d.style.left=pos[nd.id].x+"%"; d.style.top=pos[nd.id].y+"%";
    d.innerHTML=`<div class="card">${s?`<div class="pt">${portraitSVG(s)}</div>`:""}
      <div class="nm">${esc(nd.label)}</div><div class="rl">${esc(s?s.role:(nd.victim?"kurban":"ilgili"))}</div></div>`;
    d.onclick=()=>{ netSel=netSel===nd.id?null:nd.id; render(); };
    stage.appendChild(d);
  });
  const leftCol=el("div","");
  leftCol.appendChild(stage);
  const lg=el("div","netlegend");
  lg.innerHTML=`<span><i style="background:#6b5f4e"></i>açık bağlantı</span>
    <span><i style="background:#b8332a"></i>çatışma</span>
    <span><i style="background:#2c2721"></i>kilitli (kanıt gerekli)</span>
    <span class="muted">Bir kişiye tıkla: sadece onun ağı kalır.</span>`;
  leftCol.appendChild(lg);
  wrap.appendChild(leftCol);

  const side=el("div","");
  if(netSel){
    const s=suspectOf(netSel), nd=nodes.find(x=>x.id===netSel);
    const rel=links.filter(l=>l.a===netSel||l.b===netSel);
    side.innerHTML=`<div class="panel"><h3>Bağlantı dosyası</h3>
      <div style="color:var(--paper);font-size:14px">${esc(nd.label)}</div>
      <div class="small muted">${esc(s?s.role:"kurban")}</div>
      ${s?`<p class="small" style="margin-top:8px">${esc(s.bio)}</p>`:""}
      <hr class="rule">
      ${rel.map(l=>{const open=!l.locked||has(l.locked);const o=l.a===netSel?l.b:l.a;const on=nodes.find(x=>x.id===o);
        return `<div class="kv"><span>${esc(on?on.label:o)}</span><b style="color:${open?(l.red?"var(--red2)":"var(--paper2)"):"var(--dimmer)"}">${open?esc(l.label):"kilitli"}</b></div>`;}).join("")}
      <div class="row" style="margin-top:10px"><button class="btn sm" id="toInt">SORGUYA GİT</button></div></div>`;
  } else {
    const lockedCount=links.filter(l=>l.locked&&!has(l.locked)).length;
    side.innerHTML=`<div class="panel"><h3>Ağ özeti</h3>
      <div class="kv"><span>Toplam bağlantı</span><b>${links.length}</b></div>
      <div class="kv"><span>Açık</span><b>${links.length-lockedCount}</b></div>
      <div class="kv"><span>Kilitli</span><b style="color:var(--red2)">${lockedCount}</b></div>
      <p class="small muted" style="margin-top:10px">Kilitli bağlantılar kanıt topladıkça çözülür. Panodaki her yeni belge burada bir hattı aydınlatabilir.</p></div>`;
  }
  wrap.appendChild(side); v.appendChild(wrap);
  setTimeout(()=>{ const b=side.querySelector("#toInt"); if(b) b.onclick=()=>{ window.__interro=netSel; setTab("interro"); }; },0);
}

function viewTimeline(v){
  const c=C(),cs=CS(),t=c.timeline;

  hd(v,"KRONOLOJİ","Zaman çizelgesi",

    <div class="hh">${t.hours.slice(0,span).map(h=>`<span>${esc(h)}</span>`).join("")}</div>`;
