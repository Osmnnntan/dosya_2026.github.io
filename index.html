      d.innerHTML=`<span class="gitxt">${(lie?"YALAN — ":"")+esc(it.label)}</span>`;
      d.onclick=()=>modal(`<h2>${esc(s.name)}</h2>
        <div class="doc"><h4>${esc(it.label)}</h4><div class="meta">${esc(t.hours[Math.floor(it.from)]||"")} — ${esc(t.hours[Math.min(span,Math.ceil(it.to))]||"")}</div>
        <p>${lie?"Bu beyan elindeki kanıtla çelişiyor. Sorguda yüzleştirme için kullan.":"Şimdilik çelişki yok; başka kayıtlarla çapraz kontrol et."}</p></div>`);
      tr.appendChild(d);
    });
    const ph=el("div","playhead"); ph.style.left=(cs.tlT/span*100)+"%"; tr.appendChild(ph);
    row.appendChild(nm); row.appendChild(tr); g.appendChild(row);
  });
  v.appendChild(g);
  const scrub=el("div","mapscrub");
  const hAt=i=>{ const a=t.hours[Math.floor(i)]||t.hours[0], b=t.hours[Math.min(span,Math.floor(i)+1)]||a;
    const fa=parseInt(a),fb=parseInt(b); const fr=i-Math.floor(i);
    let mm=Math.round(((fb-fa+24)%24)*60*fr); let hhh=(fa+Math.floor(mm/60))%24; mm=mm%60;
    return String(hhh).padStart(2,"0")+":"+String(mm).padStart(2,"0"); };
  scrub.innerHTML=`<span class="clock" id="tlc">${hAt(cs.tlT)}</span>
    <input type="range" min="0" max="${span}" step="0.02" value="${cs.tlT}" id="tls">
    <button class="btn sm" id="tlp">OYNAT</button>`;
  v.appendChild(scrub);
  setTimeout(()=>{
    const inp=$("#tls",scrub);
    const move=val=>{ cs.tlT=val; $("#tlc",scrub).textContent=hAt(val);
      v.querySelectorAll(".playhead").forEach(p=>p.style.left=(val/span*100)+"%"); };
    inp.oninput=e=>{ move(+e.target.value); save(); };
    let tm=null;
    $("#tlp",scrub).onclick=e=>{
      if(tm){clearInterval(tm);tm=null;e.target.textContent="OYNAT";return;}
      e.target.textContent="DURDUR";
      tm=setInterval(()=>{ let val=+inp.value+span/120; if(val>span){val=0;} inp.value=val; move(val); },60);
    };
  },0);
}

    d.onclick=()=>{
      const e=pl.ev?evOf(pl.ev):null;
      modal(`<h2>${esc(pl.name)}</h2><p class="small muted">KONUM KAYDI · ${esc(c.city)}</p>
        ${e?`<div class="doc"><h4>${esc(e.title)}</h4><div class="meta">${esc(e.type)}</div><p>${esc(e.body)}</p></div>
        <div class="row" style="margin-top:10px"><button class="btn primary sm" id="mp" ${has(pl.ev)?"disabled":""}>${has(pl.ev)?"PANODA":"PANOYA EKLE"}</button></div>`
        :"<p class='small muted'>Bu noktadan çıkarılacak bir kanıt yok.</p>"}`);
      setTimeout(()=>{const b=document.getElementById("mp"); if(b)b.onclick=()=>{addEv(pl.ev);document.querySelector(".modalbg").remove();render();};},0);
    };
    stage.appendChild(d);
  });
  const drawActors=(t)=>{
    stage.querySelectorAll(".mact").forEach(x=>x.remove());
    (m.moves||[]).forEach((mv,i)=>{
      let a=mv.path[0],b=null;
      for(let k=0;k<mv.path.length;k++){ if(mv.path[k][1]<=t){a=mv.path[k];b=mv.path[k+1]||null;} }
      const pa=P(a[0]); if(!pa)return;
      let x=pa.x,y=pa.y;
      if(b){ const pb=P(b[0]); if(pb){ const f=Math.max(0,Math.min(1,(t-a[1])/((b[1]-a[1])||1)));
        x=pa.x+(pb.x-pa.x)*f; y=pa.y+(pb.y-pa.y)*f; } }
      const s=suspectOf(mv.s)||{name:mv.s};
      const d=el("div","mact"); d.style.left=x+"%"; d.style.top=y+"%"; d.style.color=routeColors[i%4];
      d.innerHTML=`<div class="dot"></div><div class="nm">${esc(s.name)}</div>`;
      stage.appendChild(d);
    });
  };
  drawActors(cs.mapT);
  const lef=el("div",""); lef.appendChild(stage);
  const scrub=el("div","mapscrub");
  const clock=i=>String((20+Math.floor(i))%24).padStart(2,"0")+":"+String(Math.round((i%1)*60)).padStart(2,"0");
  scrub.innerHTML=`<span class="clock" id="mc">${clock(cs.mapT)}</span>
    <input type="range" min="0" max="${maxT}" step="0.02" value="${cs.mapT}" id="ms">
    <button class="btn sm" id="mp2">OYNAT</button>`;
  lef.appendChild(scrub); grid.appendChild(lef);
  const side=el("div","");
  side.innerHTML=`<div class="panel"><h3>Rotalar</h3>
      ${(m.moves||[]).map((mv,i)=>{const s=suspectOf(mv.s)||{name:mv.s};
        return `<div class="kv"><span><i style="display:inline-block;width:10px;height:10px;background:${routeColors[i%4]};margin-right:6px"></i>${esc(s.name)}</span>
        <b>${mv.path.length} durak</b></div>`;}).join("")||"<span class='small muted'>Rota yok</span>"}
      <p class="small muted" style="margin-top:10px">Rota çizgileri bilinen konum kayıtlarından (baz istasyonu, kart geçişi, kamera) türetildi.</p></div>
    <div class="panel" style="margin-top:14px"><h3>Noktalar</h3>
      ${m.places.map(p=>`<div class="kv"><span>${esc(p.name)}</span><b style="color:${p.ev?(has(p.ev)?"var(--green)":"var(--red2)"):"var(--dimmer)"}">${p.ev?(has(p.ev)?"alındı":"kanıt var"):"—"}</b></div>`).join("")}</div>`;
  grid.appendChild(side); v.appendChild(grid);
  setTimeout(()=>{
    const inp=$("#ms",scrub);
    const move=val=>{ cs.mapT=val; $("#mc",scrub).textContent=clock(val); drawActors(val); };
    inp.oninput=e=>{ move(+e.target.value); save(); };
    let tm=null;
    $("#mp2",scrub).onclick=e=>{
      if(tm){clearInterval(tm);tm=null;e.target.textContent="OYNAT";return;}
      e.target.textContent="DURDUR";
      tm=setInterval(()=>{ let val=+inp.value+maxT/150; if(val>maxT)val=0; inp.value=val; move(val); },60);
    };
  },0);
}
/* ---------------- LAB + KARŞILAŞTIRMA İSTASYONU ---------------- */
let _oldLab=null;
function traceSVG(seed,color,shift){
  const r=rng(seed); let d="M0 60";
  for(let x=0;x<300;x+=6){ d+=" L"+x+" "+(60+Math.sin(x/13+r()*shift)*22*r()+ (r()-.5)*6).toFixed(1); }
  return `<svg viewBox="0 0 300 120" preserveAspectRatio="none"><rect width="300" height="120" fill="#0a0a0a"/>
    <g stroke="#1e1c19" stroke-width=".5">${[20,40,60,80,100].map(y=>`<line x1="0" y1="${y}" x2="300" y2="${y}"/>`).join("")}</g>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.4"/></svg>`;
}
function viewLabPro(v){
  hd(v,"KRİMİNAL LABORATUVAR","Adli laboratuvar",
    "Numuneleri gönder, sonuçları bekle. Alt bölümdeki karşılaştırma istasyonunda DNA/lif ve alet-balistik iz eşleştirmesi yapılır.");
  const holder=el("div",""); _oldLab(holder);
  // eski başlığı at, sadece grid'i al
  Array.from(holder.children).slice(1).forEach(ch=>v.appendChild(ch));
  const c=C(),cs=CS();
  cs.forensic=cs.forensic||{};
  const tools=FORENSIC[c.id]||[];
  if(!tools.length) return;
  v.appendChild(el("div","sec",`<h3 style="margin-top:26px">Karşılaştırma istasyonu</h3>`));
  const g=el("div","grid g2");
  tools.forEach(t=>{
    const have=has(t.need), st=cs.forensic[t.id];
    const d=el("div","panel"+(have?"":" locked"));
    const sel=st&&st.sel!=null?st.sel:0;
    const sample=t.samples[sel];
    const correctIdx=t.samples.reduce((best,x,i,arr)=>x.m>arr[best].m?i:best,0);
    const nameOf=x=>x.sid?((suspectOf(x.sid)||{name:x.sid}).name):x.tool;
    const wrongTry=st&&st.wrongSel===sel;
    d.innerHTML=`<div class="row" style="justify-content:space-between">
        <h3 style="margin:0">${esc(t.title)}</h3>
        <span class="tag ${st&&st.done?"green":have?"amber":""}">${st&&st.done?"RAPOR HAZIR":have?"HAZIR":"NUMUNE YOK"}</span></div>
      <div class="small muted" style="margin:6px 0">Referans: ${esc(t.ref.label)} · gerekli numune: ${esc((evOf(t.need)||{}).title||t.need)}</div>
      <div class="cmp">
        <div class="cmpbox"><div class="t">REFERANS</div>${traceSVG(t.ref.seed,"#c8a45c",1.2)}</div>
        <div class="cmpbox"><div class="t">KARŞILAŞTIRILAN — ${esc(nameOf(sample))}</div>${traceSVG(t.ref.seed+(sel+1)*13,(st&&st.done)?"#5f8c4d":"#8fa6b5",2.4)}</div>
      </div>
      <div class="row" style="margin-top:10px">${t.samples.map((x,i)=>`<button class="btn sm ${i===sel?"primary":"ghost"}" data-s="${i}" ${st&&st.done?"disabled":""}>${esc(nameOf(x))}</button>`).join("")}</div>
      ${st&&st.done?`<div style="margin-top:10px"><div class="small muted">UYUM ORANI · %${sample.m}</div>
        <div class="matchbar"><i style="width:${sample.m}%"></i></div>
        <div class="doc" style="margin-top:10px"><div class="stampmark">RAPOR</div><h4>${esc(t.title)}</h4>
        <div class="meta">ADLİ TIP / KRİMİNAL LABORATUVAR</div><p>${esc(t.gives.body)}</p><p>${esc(t.fiber)}</p></div></div>`
        :`<div class="row" style="margin-top:10px"><button class="btn primary sm" id="run_${t.id}" ${have?"":"disabled"}>ANALİZİ ÇALIŞTIR</button>
          <span class="small muted">${have?"Doğru numuneyi seçtiğinden emin ol":"Önce ilgili numuneyi topla"}</span></div>
          ${wrongTry?`<div class="small" style="color:var(--red2);margin-top:6px">SONUÇ: BELİRSİZ — bu numune referansla eşleşmiyor. Uyum oranı düşük çıktı (%${sample.m}); başka bir numune dene.</div>`:""}
          ${st&&st.attempts?`<div class="small muted" style="margin-top:4px">Deneme sayısı: ${st.attempts}</div>`:""}`}`;
    g.appendChild(d);
    setTimeout(()=>{
      d.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ cs.forensic[t.id]=Object.assign({},cs.forensic[t.id],{sel:+b.dataset.s,wrongSel:null}); save(); render(); });
      const rb=$("#run_"+t.id,d);
      if(rb) rb.onclick=()=>{
        if(S.expert && st && st.attempts>=1 && !st.done){
          toast("UZMAN MODU: bu numune için deneme hakkın bitti. Bu kanıt artık bu vakada kullanılamaz.","red");
          return;
        }
        rb.disabled=true; rb.textContent="ANALİZ SÜRÜYOR…";
        setTimeout(()=>{
          const attempts=((st&&st.attempts)||0)+1;
          if(sel===correctIdx){
            cs.forensic[t.id]=Object.assign({sel:sel,attempts},cs.forensic[t.id],{done:true,wrongSel:null});
            regEv(c,t.gives.id,t.gives); addEv(t.gives.id);
            toast("KARŞILAŞTIRMA TAMAMLANDI — "+t.title,"green");
          } else {
            cs.forensic[t.id]=Object.assign({},cs.forensic[t.id],{sel:sel,attempts,wrongSel:sel,done:false});
            toast("SONUÇ BELİRSİZ — bu numune eşleşmiyor, başka bir şüpheliyi dene.","red");
          }
          save(); render();
        },4000);
      };
    },0);
  });
  v.appendChild(g);
}

/* ---------------- DİJİTAL ARŞİV ---------------- */
let digTab="mail";
/* ---------------- HEX ŞİFRE ÇÖZME MİNİ-OYUNU (bulut yedek kilidi) ---------------- */
function toHex(s){ return Array.from(s).map(c=>c.charCodeAt(0).toString(16).padStart(2,"0")).join(" "); }
function openHexPuzzle(c){
  const cs=CS();
  const real = (c.hexWord)||"KANIT";
  const decoys = (c.hexDecoys)||["YALAN","BOŞLUK","GÜRÜLTÜ","SAHTE"];
  const words = shuffleArr([real,...decoys]).slice(0,5);
  if(!words.includes(real)) words[0]=real;
  const shuffled = shuffleArr(words);
  const html = `<h2>ŞİFRELİ BLOK — HEX AYRIŞTIRICI</h2>
    <p class="small muted">Bozuk yedek, birden çok olası bloğa ayrıştı. Akan hex dizilerinden gerçek veriyi taşıyanı seç — diğerleri gürültü/çöp veridir. Yanlış seçim bloğu bozar, tekrar denemen gerekir.</p>
    <div class="hexgrid" id="hexgrid">${shuffled.map((w,i)=>`
      <button class="hexrow" data-w="${esc(w)}">
        <span class="hexcode">${esc(toHex(w))}</span>
        <span class="hexdecode">ÇÖZ →</span>
      </button>`).join("")}</div>
    <p class="small muted" style="margin-top:10px" id="hexmsg"></p>`;
  const {bg,m:box}=modal(html);
  box.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{
    if(b.dataset.w===real){
      CS().cloudUnlocked=true; save();
      $("#hexmsg",box).innerHTML="<span style='color:var(--green)'>BLOK ÇÖZÜLDÜ: "+esc(real)+"</span> — yedek artık erişilebilir.";
      toast("HEX BLOK ÇÖZÜLDÜ — bulut yedeği açıldı","green");
      sfx("unlock");
      setTimeout(()=>{ bg.remove(); render(); },900);
    } else {
      $("#hexmsg",box).innerHTML="<span style='color:var(--red2)'>YANLIŞ BLOK — gürültü verisiydi. Tekrar dene.</span>";
      b.disabled=true; b.style.opacity=.35;
      sfx("stamp");
    }
  });
}
function viewDigital(v){
  const c=C(),cs=CS(),D=DIGITAL[c.id];
  hd(v,"DİJİTAL DELİL ARŞİVİ","Telefon dışı dijital dosyalar",
    "E-posta kutusu, operatör (SIM/IMEI) kayıtları ve bulut yedekleri. Buradan alınan her belge kanıt panosuna yeni bir dosya türü olarak düşer.");
  if(!D){ v.appendChild(el("div","panel","<p class='small muted'>Bu dosya için dijital arşiv açılmadı.</p>")); return; }
  const rack=el("div","toolrack"); rack.innerHTML=`<span class="lb">KAYNAK</span>`;
  const seg=el("div","seg");
  [["mail","E-POSTA KUTUSU"],["sim","SIM / IMEI KAYDI"],["cloud","BULUT YEDEKLERİ"]].forEach(([k,l])=>{
    const b=el("button",digTab===k?"on":"",l); b.onclick=()=>{digTab=k;render();}; seg.appendChild(b);
  });
  rack.appendChild(seg); v.appendChild(rack);
  const box=el("div","panel pad0");
  if(digTab==="mail"){
    box.innerHTML=`<div style="padding:11px 12px;border-bottom:1px solid var(--hair2)" class="small muted">
      GELEN KUTUSU · ${esc(D.mail.account)} · ${D.mail.items.length} ileti (adli kopya)</div>`;
    D.mail.items.forEach(it=>{
      const row=el("div","mailrow"+(has(it.ev.id)?"":" unread"));
      row.innerHTML=`<div class="fr">${esc(it.from)}</div><div class="sb">${esc(it.subj)}</div><div class="dt">${esc(it.date)}</div>`;
      row.onclick=()=>{
        modal(`<h2>${esc(it.subj)}</h2><p class="small muted">Kimden: ${esc(it.from)} · ${esc(it.date)}</p>
          <div class="doc"><h4>E-POSTA GÖVDESİ</h4><div class="meta">${esc(D.mail.account)}</div><p>${esc(it.body)}</p></div>
          <div class="row" style="margin-top:10px"><button class="btn primary sm" id="mv" ${has(it.ev.id)?"disabled":""}>${has(it.ev.id)?"PANODA":"PANOYA EKLE"}</button></div>`);
        setTimeout(()=>{const b=document.getElementById("mv"); if(b)b.onclick=()=>{regEv(c,it.ev.id,it.ev);addEv(it.ev.id);document.querySelector(".modalbg").remove();render();};},0);
      };
      box.appendChild(row);
    });
  } else if(digTab==="sim"){
    box.innerHTML=`<div style="padding:11px 12px;border-bottom:1px solid var(--hair2)" class="small muted">
      OPERATÖR KAYDI · HAT ${esc(D.sim.msisdn)}</div>`;
    D.sim.items.forEach(it=>{
      const r=el("div","simrow");
      r.innerHTML=`<div><b style="color:var(--paper2)">${esc(it.t)}</b><div class="small muted">${esc(it.x)}</div></div>
        <div class="small" style="color:var(--accent);white-space:nowrap">${esc(it.d)}</div>`;
      box.appendChild(r);
    });
    const f=el("div",""); f.style.padding="12px";
    f.innerHTML=`<button class="btn primary sm" id="simadd" ${has(D.sim.ev.id)?"disabled":""}>${has(D.sim.ev.id)?"PANODA":"KAYDI PANOYA EKLE"}</button>`;
    box.appendChild(f);
    setTimeout(()=>{const b=$("#simadd",f); if(b)b.onclick=()=>{regEv(c,D.sim.ev.id,D.sim.ev);addEv(D.sim.ev.id);render();};},0);
  } else {
    const wrap=el("div",""); wrap.style.padding="12px"; wrap.className="grid g2";
    D.cloud.items.forEach((it,idx)=>{
      const isLocked = idx===0 && !cs.cloudUnlocked;
      const d=el("div","cloudcard");
      if(isLocked){
        d.innerHTML=`<div style="color:var(--paper2);font-size:12.5px">${esc(it.t)}</div>
          <div class="small muted">Yedek: ${esc(it.d)}</div>
          <div class="small" style="margin-top:6px;color:var(--red2)">ŞİFRELİ YEDEK — erişim için önce blok bütünlüğünü doğrula.</div>
          <div class="badgeline"><span class="tag red">KİLİTLİ</span></div>
          <div class="row" style="margin-top:8px"><button class="btn sm primary" data-hex="${idx}">ŞİFRE ÇÖZÜCÜYÜ AÇ</button></div>`;
      } else {
        d.innerHTML=`<div style="color:var(--paper2);font-size:12.5px">${esc(it.t)}</div>
          <div class="small muted">Yedek: ${esc(it.d)}</div>
          <div class="small" style="margin-top:6px">${esc(it.x)}</div>
          <div class="badgeline"><span class="tag">BULUT</span>${has(it.ev.id)?"<span class='tag green'>PANODA</span>":"<span class='tag amber'>ALINMADI</span>"}</div>
          <div class="row" style="margin-top:8px"><button class="btn sm" data-c="${esc(it.ev.id)}" ${has(it.ev.id)?"disabled":""}>GERİ YÜKLE VE PANOYA EKLE</button></div>`;
      }
      wrap.appendChild(d);
    });
    box.appendChild(wrap);
    setTimeout(()=>{
      wrap.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ const it=D.cloud.items.find(x=>x.ev.id===b.dataset.c); regEv(c,it.ev.id,it.ev); addEv(it.ev.id); render(); });
      wrap.querySelectorAll("[data-hex]").forEach(b=>b.onclick=()=>openHexPuzzle(c));
    },0);
  }
  v.appendChild(box);
}
